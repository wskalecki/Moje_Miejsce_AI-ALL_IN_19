<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moje Miejsce — plan dopasowania okolic Warszawy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;1,8..60,400;1,8..60,500;1,8..60,600&display=swap" rel="stylesheet">
<style>
/* ------------------------------------------------------------------
   Tokens — kartografia: biel papieru, czerń druku, błękit wody,
   oliwkowa skala sekwencyjna, czerwień trasy.
------------------------------------------------------------------ */
:root{
  --paper:#FFFFFF;
  --ground:#F5F6F5;
  --ink:#1B2125;
  --ink-2:#465056;
  --ink-3:#5F696F;
  --rule:#DADEE0;
  --rule-2:#B3BABE;
  --water:#BCD7E7;
  --water-edge:#8DB7D1;
  --water-ink:#2C6990;
  --red:#C4161C;
  --red-ink:#A51217;
  --green-ink:#3E6A2A;
  --m0:#EEF1E3; --m1:#D6E0B6; --m2:#B4C98B; --m3:#88AA5F; --m4:#5C8641; --m5:#365F29;
  --serif:"Source Serif 4", "Iowan Old Style", Georgia, serif;
  --sans:"Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px;
  --index-w:256px; --sheet-w:436px; --top-h:56px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font:400 14px/1.45 var(--sans);
  font-variant-numeric:lining-nums tabular-nums;
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus{outline:none}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.app{
  display:grid; height:100vh; min-height:640px;
  grid-template-columns:var(--index-w) minmax(0,1fr) var(--sheet-w);
  grid-template-rows:var(--top-h) minmax(0,1fr);
  grid-template-areas:"top top top" "index plan sheet";
}

/* ---------------- Pasek tytułowy ---------------- */
.top{
  grid-area:top; display:flex; align-items:stretch; gap:var(--s5);
  padding:0 var(--s5) 0 var(--s5); border-bottom:1px solid var(--ink);
}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);flex:none}
.brand svg{display:block}
.brand b{font:600 20px/1 var(--serif);letter-spacing:-.005em}
.title-line{
  display:flex;align-items:center;gap:var(--s3);
  padding-left:var(--s5);border-left:1px solid var(--rule);margin:14px 0;
  font:italic 400 15px/1.2 var(--serif);color:var(--ink-2);min-width:0;
}
.title-line span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.profile{margin-left:auto;display:flex;align-items:stretch;gap:var(--s4)}
.profile-desc{align-self:center;font:italic 400 14px/1.3 var(--serif);color:var(--ink-3);text-align:right;max-width:260px}
.seg{display:flex;align-items:stretch;border-left:1px solid var(--rule)}
.seg-label{align-self:center;padding:0 var(--s3) 0 var(--s4);font-size:13px;color:var(--ink-3)}
.seg button{
  position:relative;border:0;background:none;padding:0 var(--s3);
  font:500 15px/1 var(--sans);color:var(--ink-2);
}
.seg button::after{content:"";position:absolute;left:var(--s3);right:var(--s3);bottom:-1px;height:3px;background:transparent}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{color:var(--ink);font-weight:600}
.seg button[aria-pressed="true"]::after{background:var(--red)}
.seg button:focus-visible{outline-offset:-6px}

/* ---------------- Skorowidz ---------------- */
.index{grid-area:index;display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--rule)}
.index-head{padding:var(--s5) var(--s4) var(--s3) var(--s5)}
.index-head h2{margin:0;font:600 18px/1.2 var(--serif)}
.index-head p{margin:4px 0 0;font-size:13px;color:var(--ink-3)}
.search{margin:var(--s3) 0 0;position:relative}
.search input{
  width:100%;height:34px;padding:0 10px 0 30px;border:1px solid var(--rule-2);border-radius:0;
  background:var(--paper);font-size:14px;
}
.search input::placeholder{color:var(--ink-3)}
.search input:focus-visible{outline:2px solid var(--ink);outline-offset:-1px;border-color:var(--ink)}
.search svg{position:absolute;left:10px;top:10px;pointer-events:none}
.index-cols{
  display:grid;grid-template-columns:28px 1fr 24px 32px;gap:0 var(--s2);
  padding:var(--s2) var(--s4) 6px var(--s3);border-bottom:1px solid var(--ink);
  font-size:12px;color:var(--ink-3);
}
.index-cols span:nth-child(1),.index-cols span:nth-child(4){text-align:right}
.index-cols span:nth-child(3){text-align:center}
.index-list{list-style:none;margin:0;padding:0 0 var(--s4);overflow:auto;flex:1;scrollbar-width:thin}
.index-list li{border-bottom:1px solid #EEF0F1}
.index-list button{
  display:grid;grid-template-columns:28px 1fr 24px 32px;gap:0 var(--s2);align-items:baseline;
  width:100%;padding:7px var(--s4) 7px var(--s3);border:0;background:none;text-align:left;position:relative;
}
.index-list button:hover,.index-list button.is-hot{background:#F3F5F5}
.index-list button[aria-current="true"]{background:#F3F5F5}
.index-list button[aria-current="true"]::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--red)}
.index-list button:focus-visible{outline-offset:-2px}
.ix-rank{text-align:right;font:500 13px/1.3 var(--sans);color:var(--ink-3)}
.ix-name{min-width:0}
.ix-name b{display:block;font:500 14px/1.25 var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ix-name small{display:block;font-size:12px;line-height:1.3;color:var(--ink-3)}
.ix-grid{text-align:center;font-size:13px;color:var(--ink-2)}
.ix-match{display:flex;align-items:center;justify-content:flex-end;gap:5px;font:600 14px/1 var(--sans)}
.ix-match i{width:9px;height:9px;flex:none;box-shadow:inset 0 0 0 1px rgba(27,33,37,.25)}
.index-empty{padding:var(--s4) var(--s5);color:var(--ink-3);font-style:italic}

/* ---------------- Plan ---------------- */
.plan{grid-area:plan;position:relative;min-width:0;min-height:0;background:var(--paper);overflow:hidden}
.plan .neat-outer{position:absolute;inset:10px;border:1.5px solid var(--ink);pointer-events:none}
.frame{position:absolute;inset:34px;border:1px solid var(--ink);overflow:hidden;background:var(--paper)}
.frame svg.map{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.frame svg.map.is-drag{cursor:grabbing}
.ticks{position:absolute;inset:10px;pointer-events:none}
.ticks span{
  position:absolute;font:500 12px/1 var(--sans);color:var(--ink-2);
  transform:translate(-50%,-50%);
}
.ticks i{position:absolute;background:var(--ink)}

/* elementy mapy */
.os{stroke:#fff;stroke-width:.7;vector-effect:non-scaling-stroke;cursor:pointer;transition:fill .35s ease}
.dline{fill:none;stroke:var(--ink-2);stroke-width:2.6;stroke-dasharray:7 2.5 1.5 2.5;vector-effect:non-scaling-stroke}
.gridline{stroke:rgba(27,33,37,.16);stroke-width:.8;vector-effect:non-scaling-stroke}
.river-edge{fill:none;stroke:var(--water-edge);stroke-linecap:round;stroke-linejoin:round}
.river{fill:none;stroke:var(--water);stroke-linecap:round;stroke-linejoin:round}
.hl-casing{fill:none;stroke:#fff;stroke-width:5;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.hl-sel{fill:none;stroke:var(--red);stroke-width:2.2;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.hl-hover{fill:none;stroke:var(--ink);stroke-width:1.6;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.lbl{paint-order:stroke;stroke:#fff;stroke-linejoin:round;pointer-events:none}
.lbl-os{font-family:var(--serif);font-style:italic;font-weight:500;fill:var(--ink)}
.lbl-os.is-sel{font-weight:600;fill:var(--ink)}
.lbl-dz{font-family:var(--serif);font-weight:400;fill:var(--ink-2);text-transform:uppercase}
.lbl-water{font-family:var(--serif);font-style:italic;font-weight:500;fill:var(--water-ink)}
.lbl-road{font-family:var(--sans);font-weight:500;fill:#3B4449}
.lbl-green{font-family:var(--serif);font-style:italic;font-weight:500;fill:var(--green-ink)}
.pm circle{fill:var(--red);stroke:#fff}
.pm text{font-family:var(--sans);font-weight:700;fill:#fff;text-anchor:middle}
.pm.is-hot circle{fill:var(--ink)}
.pm{cursor:pointer}

/* nakładki na planie */
.cartouche{position:absolute;left:16px;bottom:16px;pointer-events:none;width:214px;background:var(--paper);padding:10px 12px 0 0}
.cartouche h2{margin:0;font:400 20px/1 var(--serif);letter-spacing:.3em;text-transform:uppercase}
.cartouche p{margin:6px 0 0;font:italic 400 14px/1.3 var(--serif);color:var(--ink-2)}
.modes{position:absolute;left:16px;top:16px;display:flex;background:var(--paper);border:1px solid var(--ink)}
.modes button{border:0;background:var(--paper);padding:7px 12px;font:500 13px/1.1 var(--sans);color:var(--ink-2)}
.modes button+button{border-left:1px solid var(--ink)}
.modes button[aria-pressed="true"]{background:var(--ink);color:#fff}
.modes button:hover:not([aria-pressed="true"]){background:#F1F3F4;color:var(--ink)}
.modes button:focus-visible{outline-offset:2px}
.zoom{position:absolute;right:16px;bottom:16px;display:flex;flex-direction:column;background:var(--paper);border:1px solid var(--ink)}
.zoom button{width:34px;height:34px;border:0;background:var(--paper);display:grid;place-items:center}
.zoom button+button{border-top:1px solid var(--rule-2)}
.zoom button:hover{background:#F1F3F4}
.zoom button:focus-visible{outline-offset:2px}

.legend{
  position:absolute;right:16px;top:16px;width:236px;background:var(--paper);
  border:1px solid var(--ink);padding:var(--s3) var(--s4) var(--s4);
}
.legend h3{margin:0 0 2px;font:600 15px/1.2 var(--serif)}
.legend .lg-sub{margin:0 0 var(--s2);font-size:12.5px;color:var(--ink-2)}
.ramp{display:grid;grid-template-columns:repeat(6,1fr);height:12px;border:1px solid var(--ink)}
.ramp-ticks{position:relative;height:16px;font-size:12px;color:var(--ink-2)}
.ramp-ticks span{position:absolute;top:2px;transform:translateX(-50%)}
.ramp-ticks span::before{content:"";position:absolute;left:50%;top:-3px;width:1px;height:4px;background:var(--ink)}
.ramp-ends{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-3);margin-top:2px}
.lg-rows{list-style:none;margin:var(--s3) 0 0;padding:var(--s3) 0 0;border-top:1px solid var(--rule);display:grid;gap:6px}
.lg-rows li{display:grid;grid-template-columns:28px 1fr;gap:var(--s2);align-items:center;font-size:12.5px;line-height:1.25;color:var(--ink-2)}
.lg-rows svg{display:block}
.scalebar{margin-top:var(--s3);padding-top:var(--s3);border-top:1px solid var(--ink);display:flex;align-items:flex-end;justify-content:space-between;gap:var(--s3)}
.scalebar .sb-num{font-size:12px;color:var(--ink-3);margin-top:3px}
.north{flex:none;display:flex;flex-direction:column;align-items:center;font:600 12px/1 var(--serif);color:var(--ink)}

.tip{
  position:absolute;z-index:5;pointer-events:none;background:var(--paper);border:1px solid var(--ink);
  padding:8px 10px 9px;min-width:170px;max-width:260px;transform:translate(14px,14px);display:none;
}
.tip.on{display:block}
.tip b{display:block;font:italic 600 16px/1.2 var(--serif)}
.tip small{display:block;font-size:12px;color:var(--ink-3);margin-top:1px}
.tip .tip-row{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:13px;color:var(--ink-2)}
.tip .tip-row i{width:10px;height:10px;box-shadow:inset 0 0 0 1px rgba(27,33,37,.25)}
.tip .tip-row strong{color:var(--ink);font-weight:600}

/* ---------------- Arkusz objaśnień ---------------- */
.sheet{grid-area:sheet;min-height:0;overflow:auto;border-left:1px solid var(--ink);background:var(--paper);scrollbar-width:thin}
.sh-in{padding:var(--s5) var(--s5) var(--s7)}
.sh-meta{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--ink-3);padding-bottom:var(--s3);border-bottom:1px solid var(--rule)}
.sh-meta .ref{display:flex;gap:var(--s3)}
.sh-meta .ref span+span{padding-left:var(--s3);border-left:1px solid var(--rule)}
.sh-meta button{border:0;background:none;padding:2px 0;font-size:13px;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--rule-2)}
.sh-meta button:hover{color:var(--ink);text-decoration-color:var(--ink)}
.sh-name{margin:var(--s4) 0 0;font:600 36px/1.05 var(--serif);letter-spacing:-.012em}
.sh-district{margin:8px 0 0;font:400 13px/1 var(--serif);letter-spacing:.3em;text-transform:uppercase;color:var(--ink-2)}
.figs{display:grid;grid-template-columns:1fr 1fr 1.25fr;margin:var(--s5) 0 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--rule)}
.figs>div{padding:var(--s3) 0 var(--s3) var(--s3)}
.figs>div:first-child{padding-left:0}
.figs>div+div{border-left:1px solid var(--rule)}
.figs dt{font-size:12.5px;color:var(--ink-3);line-height:1.25}
.figs dd{margin:4px 0 0;font:500 28px/1 var(--serif);display:flex;align-items:baseline;gap:5px;white-space:nowrap}
.figs dd small{font:400 13px/1 var(--sans);color:var(--ink-3)}
.figs dd i{width:12px;height:12px;align-self:center;box-shadow:inset 0 0 0 1px rgba(27,33,37,.25)}

.photo{margin:var(--s5) 0 0}
.photo-main{position:relative;aspect-ratio:16/9;background:#E8EBEC;overflow:hidden}
.photo-main img{width:100%;height:100%;object-fit:cover;display:block}
.photo figcaption{display:flex;justify-content:space-between;gap:var(--s3);margin-top:6px;font-size:12px;line-height:1.35;color:var(--ink-3)}
.photo figcaption span:first-child{color:var(--ink-2)}
.thumbs{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:var(--s2)}
.thumbs button{padding:0;border:0;background:none;aspect-ratio:3/2;overflow:hidden;position:relative;opacity:.72;transition:opacity .2s}
.thumbs button:hover{opacity:1}
.thumbs button[aria-current="true"]{opacity:1;outline:2px solid var(--ink);outline-offset:1px}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block}

.lead{margin:var(--s5) 0 0;font:400 18px/1.45 var(--serif);color:var(--ink)}
.weak{margin:var(--s2) 0 0;font-size:14px;color:var(--ink-2)}
.weak b{font-weight:600;color:var(--ink)}

.sec{margin-top:var(--s6);padding-top:var(--s3);border-top:1px solid var(--ink)}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s3);margin:0 0 var(--s3)}
.sec-h h3{margin:0;font:600 19px/1.2 var(--serif)}
.sec-h p{margin:0;font-size:12.5px;color:var(--ink-3);text-align:right}
.note{font-size:12.5px;line-height:1.45;color:var(--ink-3);margin:var(--s3) 0 0}

/* kategorie */
.cats{list-style:none;margin:0;padding:0}
.cats li{display:grid;grid-template-columns:156px 1fr 30px;gap:var(--s3);align-items:center;padding:7px 0;border-bottom:1px solid #EEF0F1}
.cats li.is-pri .c-name{font-weight:600}
.c-name{font-size:14px;display:flex;align-items:center;gap:6px}
.c-name em{font-style:normal;width:7px;height:7px;background:var(--red);flex:none}
.c-bar{position:relative;height:8px;background:#EDEFF0}
.c-bar b{position:absolute;left:0;top:0;bottom:0;background:var(--m4)}
.cats li:not(.is-pri) .c-bar b{background:#9DA6AB}
.c-bar i{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);transform:translateX(-1px)}
.c-val{text-align:right;font-weight:600;font-size:14px}
.c-why{grid-column:1/-1;margin-top:-2px;font-size:12.5px;line-height:1.35;color:var(--ink-3)}
.cats-key{display:flex;flex-wrap:wrap;gap:4px var(--s4);margin-top:var(--s2);font-size:12.5px;color:var(--ink-3)}
.cats-key span{display:inline-flex;align-items:center;gap:6px}
.cats-key em{width:7px;height:7px;background:var(--red)}
.cats-key i{width:2px;height:12px;background:var(--ink)}

/* plan szczegółowy w arkuszu */
.inset{position:relative;border:1px solid var(--ink);background:var(--ground)}
.inset svg{display:block;width:100%;height:auto}
.inset-bar{display:flex;justify-content:space-between;align-items:center;gap:var(--s3);margin-top:6px;font-size:12px;color:var(--ink-3)}
.linkbtn{border:0;background:none;padding:0;font-size:13px;font-weight:600;color:var(--ink);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--red);text-decoration-thickness:2px}
.linkbtn:hover{color:var(--red-ink)}
.places{list-style:none;margin:var(--s3) 0 0;padding:0}
.places li{display:grid;grid-template-columns:22px 1fr auto;gap:var(--s3);padding:8px 0;border-bottom:1px solid #EEF0F1;align-items:start}
.places li.is-hot{background:#F6F7F7}
.p-no{width:20px;height:20px;border-radius:50%;background:var(--red);color:#fff;font:700 11px/20px var(--sans);text-align:center;margin-top:1px}
.p-name{font-size:14px;font-weight:600;line-height:1.3}
.p-desc{font-size:12.5px;color:var(--ink-3);line-height:1.35;margin-top:1px}
.p-min{text-align:right;white-space:nowrap}
.p-min b{font:500 20px/1 var(--serif)}
.p-min small{display:block;font-size:12px;color:var(--ink-3);margin-top:3px}

/* dojazdy */
.tt{width:100%;border-collapse:collapse}
.tt th{font-weight:400;font-size:12.5px;color:var(--ink-3);text-align:right;padding:0 0 6px;border-bottom:1px solid var(--ink)}
.tt th:first-child{text-align:left}
.tt td{padding:9px 0;border-bottom:1px solid #EEF0F1;vertical-align:top}
.tt td.n{text-align:right;font:500 20px/1 var(--serif);white-space:nowrap;padding-left:var(--s4)}
.tt td.n small{font:400 12px var(--sans);color:var(--ink-3);margin-left:2px}
.tt .dest{font-size:14px;font-weight:600;line-height:1.3}
.tt .modes-line{font-size:12.5px;color:var(--ink-3);margin-top:2px}

/* ceny */
.price-head{display:flex;align-items:baseline;gap:var(--s3);flex-wrap:wrap}
.price-head b{font:500 34px/1 var(--serif)}
.price-head span{font-size:14px;color:var(--ink-2)}
.pchart{margin-top:var(--s4)}
.pchart svg{display:block;width:100%;height:auto;overflow:visible}
.pchart text{font-family:var(--sans);font-size:12px;fill:var(--ink-3)}
.pchart .pl{font-size:13px;fill:var(--ink);font-weight:600}

/* ruch */
.traffic svg{display:block;width:100%;height:auto}
.traffic text{font-family:var(--sans);font-size:11.5px;fill:var(--ink-3)}

/* plany zmian */
.tl{list-style:none;margin:0;padding:0;position:relative}
.tl li{display:grid;grid-template-columns:62px 14px 1fr;gap:0 var(--s3);padding:0 0 var(--s4);position:relative}
.tl li::before{content:"";position:absolute;left:calc(62px + var(--s3) + 6px);top:16px;bottom:-2px;width:1px;background:var(--rule-2)}
.tl li:last-child::before{display:none}
.tl-year{font:500 20px/1.1 var(--serif);text-align:right}
.tl-year small{display:block;font:400 12px/1.25 var(--sans);color:var(--ink-3);margin-top:2px}
.tl-dot{width:13px;height:13px;border-radius:50%;border:2px solid var(--ink);background:var(--paper);margin-top:4px;position:relative;z-index:1}
.tl-dot.is-build{background:var(--red);border-color:var(--red)}
.tl-title{font-size:14.5px;font-weight:600;line-height:1.3}
.tl-st{font-size:12.5px;color:var(--ink-3);margin-top:2px}
.tl-st b{font-weight:600;color:var(--ink-2)}
.tl-desc{font-size:13px;color:var(--ink-2);line-height:1.45;margin-top:4px}
.tl-key{display:flex;gap:var(--s4);font-size:12.5px;color:var(--ink-3);margin:-4px 0 var(--s4)}
.tl-key span{display:inline-flex;align-items:center;gap:6px}
.tl-key i{width:10px;height:10px;border-radius:50%;border:2px solid var(--ink)}
.tl-key i.b{background:var(--red);border-color:var(--red)}

.portals{display:grid;grid-template-columns:1fr auto auto;gap:6px var(--s4);font-size:14px;margin-top:var(--s2)}
.portals a{color:var(--ink);text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--rule-2)}
.portals a:hover{text-decoration-color:var(--ink)}
.colophon{margin-top:var(--s6);padding-top:var(--s3);border-top:1px solid var(--rule);font-size:12.5px;line-height:1.5;color:var(--ink-3)}
.colophon p{margin:0 0 var(--s2)}

/* karta skrócona */
.compact-note{margin-top:var(--s5);padding:var(--s3) 0 0;border-top:1px solid var(--rule);font-size:13px;color:var(--ink-3)}
.compact-note .linkbtn{margin-top:6px;display:inline-block}

.mobile-index{display:none}

@media (max-width:1180px){
  :root{--index-w:0px;--sheet-w:420px}
  .index{display:none}
}
@media (max-width:860px){
  .app{display:flex;flex-direction:column;height:auto;min-height:0}
  .app>*{min-width:0;width:100%}
  .top{order:0}.plan{order:1}.sheet{order:2}.index{order:3}
  .top{flex-wrap:wrap;gap:0 var(--s4);padding:var(--s3) var(--s4)}
  .title-line{display:none}
  .profile{margin-left:0;width:100%;justify-content:space-between;margin-top:var(--s2);gap:var(--s2)}
  .profile-desc{display:none}
  .seg{border-left:0;width:100%}
  .seg-label{padding-left:0}
  .seg button{padding:10px var(--s3) 12px}
  .plan{height:min(78vh,640px);min-height:460px}
  .plan .neat-outer{inset:6px}
  .frame{inset:24px}
  .ticks{inset:6px}
  .cartouche{left:8px;bottom:8px;width:170px;padding:6px 8px 0 0}
  .cartouche h2{font-size:15px}
  .cartouche p{display:none}
  .cartouche .sb-num{display:none}
  .modes{left:8px;top:8px}
  .modes button{padding:6px 9px;font-size:12.5px}
  .legend{display:none}
  .zoom{right:8px;bottom:8px}
  .sheet{border-left:0;border-top:1px solid var(--ink)}
  .sh-in{padding:var(--s4) var(--s4) var(--s6)}
  .sh-name{font-size:30px}
  .figs dd{font-size:24px}
  .cats li{grid-template-columns:112px 1fr 28px}
  .index{display:flex;border-right:0;border-top:1px solid var(--ink)}
  .index-list{max-height:60vh}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <a class="brand" href="#" aria-label="Moje Miejsce — strona główna">
      <svg width="26" height="26" viewBox="0 0 26 26" aria-hidden="true">
        <rect x="1" y="1" width="24" height="24" fill="none" stroke="#1B2125" stroke-width="1.6"></rect>
        <rect x="4.5" y="4.5" width="17" height="17" fill="none" stroke="#1B2125" stroke-width=".8"></rect>
        <path d="M4.5 13H21.5M13 4.5V21.5" stroke="#1B2125" stroke-width=".8"></path>
        <circle cx="9" cy="9" r="2.6" fill="#C4161C"></circle>
      </svg>
      <b>Moje Miejsce</b>
    </a>
    <div class="title-line"><span>Warszawa. Plan dopasowania okolic do sposobu życia</span></div>
    <div class="profile">
      <p class="profile-desc" id="profileDesc"></p>
      <div class="seg" role="group" aria-label="Profil">
        <span class="seg-label">Profil</span>
        <button type="button" data-p="student" aria-pressed="false">Student</button>
        <button type="button" data-p="rodzina" aria-pressed="false">Rodzina</button>
        <button type="button" data-p="senior" aria-pressed="true">Senior</button>
      </div>
    </div>
  </header>

  <aside class="index" aria-labelledby="ixTitle">
    <div class="index-head">
      <h2 id="ixTitle">Skorowidz osiedli</h2>
      <p id="ixSub"></p>
      <label class="search">
        <span class="sr">Szukaj osiedla lub dzielnicy</span>
        <svg width="13" height="13" viewBox="0 0 13 13" aria-hidden="true"><circle cx="5.5" cy="5.5" r="4.4" fill="none" stroke="#5F696F" stroke-width="1.4"></circle><path d="M8.8 8.8L12 12" stroke="#5F696F" stroke-width="1.4"></path></svg>
        <input id="ixSearch" type="search" placeholder="Szukaj osiedla" autocomplete="off">
      </label>
    </div>
    <div class="index-cols" aria-hidden="true"><span>Nr</span><span>Osiedle</span><span>Pole</span><span>Dop.</span></div>
    <ul class="index-list" id="ixList"></ul>
  </aside>

  <main class="plan" id="plan" aria-label="Plan Warszawy">
    <div class="neat-outer" aria-hidden="true"></div>
    <div class="ticks" id="ticks" aria-hidden="true"></div>
    <div class="frame" id="frame">
      <svg class="map" id="map" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="mapTitle">
        <title id="mapTitle">Plan Warszawy: 143 osiedla pokolorowane według dopasowania do wybranego profilu</title>
        <defs id="mapDefs"></defs>
        <g id="cityRoot"></g>
        <g id="detailRoot" style="display:none"></g>
      </svg>
      <div class="cartouche" id="cartouche"></div>
      <div class="modes" role="group" aria-label="Arkusz planu">
        <button type="button" data-mode="city" aria-pressed="true">Warszawa</button>
        <button type="button" data-mode="detail" aria-pressed="false">Stare Bielany, plan szczegółowy</button>
      </div>
      <div class="zoom" role="group" aria-label="Powiększenie planu">
        <button type="button" id="zIn" aria-label="Przybliż"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M7 1v12M1 7h12" stroke="#1B2125" stroke-width="1.6"></path></svg></button>
        <button type="button" id="zOut" aria-label="Oddal"><svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M1 7h12" stroke="#1B2125" stroke-width="1.6"></path></svg></button>
        <button type="button" id="zReset" aria-label="Pokaż cały arkusz"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M1.5 5V1.5H5M11 1.5h3.5V5M14.5 11v3.5H11M5 14.5H1.5V11" fill="none" stroke="#1B2125" stroke-width="1.5"></path></svg></button>
      </div>
      <section class="legend" id="legend" aria-label="Objaśnienia planu"></section>
      <div class="tip" id="tip" role="status" aria-live="polite"></div>
    </div>
  </main>

  <section class="sheet" id="sheet" aria-label="Arkusz objaśnień osiedla" tabindex="-1"></section>
</div>

<script src="../shared/data.js"></script>
<script>
(function(){
'use strict';
const MM = window.MM;
const OS = MM.city.osiedla;
const F = MM.featured;
const N = MM.neighborhood;
const byId = Object.fromEntries(OS.map(o => [o.id, o]));
const S = { profile: MM.activeProfile || 'senior', selected: 'stare-bielany', mode: 'city', hover: null, photo: 0, hotPlace: null };

const $ = s => document.querySelector(s);
const nf = new Intl.NumberFormat('pl-PL');
const nf1 = new Intl.NumberFormat('pl-PL', { maximumFractionDigits: 1 });
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* ---------- skala dopasowania ---------- */
const BREAKS = [30, 40, 50, 60, 70];
const RAMP = ['#EEF1E3', '#D6E0B6', '#B4C98B', '#88AA5F', '#5C8641', '#365F29'];
const cls = v => { let i = 0; while (i < BREAKS.length && v >= BREAKS[i]) i++; return i; };
const col = v => RAMP[cls(v)];

/* ---------- geometria ---------- */
function parsePts(d) {
  const rings = []; let cur = null; const re = /([MLZ])\s*(-?[\d.]+)?[\s,]*(-?[\d.]+)?/g; let m;
  while ((m = re.exec(d))) {
    if (m[1] === 'M') { cur = [[+m[2], +m[3]]]; rings.push(cur); }
    else if (m[1] === 'L') cur.push([+m[2], +m[3]]);
  }
  return rings;
}
function ringArea(r) { let a = 0; for (let i = 0; i < r.length; i++) { const p = r[i], q = r[(i + 1) % r.length]; a += p[0] * q[1] - q[0] * p[1]; } return Math.abs(a / 2); }
const median = a => { const s = [...a].sort((x, y) => x - y); return s[Math.floor(s.length / 2)]; };

// skala planu miasta: z powierzchni osiedli (areaKm2) i pól wielokątów w układzie planu
const M_PER_UNIT_CITY = median(OS.map(o => Math.sqrt(o.areaKm2 / parsePts(o.d).reduce((s, r) => s + ringArea(r), 0)))) * 1000;
// skala planu szczegółowego: odległości między punktami miejsc (współrzędne geogr.) a ich pozycjami
const M_PER_UNIT_DETAIL = (() => {
  const P = N.places.map(p => ({ xy: p.xy, c: (F.highlights.find(h => h.id === p.id) || {}).coord })).filter(p => p.c);
  const R = 6371000, rad = x => x * Math.PI / 180, out = [];
  for (let i = 0; i < P.length; i++) for (let j = i + 1; j < P.length; j++) {
    const a = P[i].c, b = P[j].c;
    const s = Math.sin(rad(b[1] - a[1]) / 2) ** 2 + Math.cos(rad(a[1])) * Math.cos(rad(b[1])) * Math.sin(rad(b[0] - a[0]) / 2) ** 2;
    const du = Math.hypot(P[i].xy[0] - P[j].xy[0], P[i].xy[1] - P[j].xy[1]);
    if (du > 150) out.push(2 * R * Math.asin(Math.sqrt(s)) / du);
  }
  return median(out);
})();

const GRID = 8, LETTERS = 'ABCDEFGH';
const gridRef = (x, y, w, h) => LETTERS[Math.min(GRID - 1, Math.max(0, Math.floor(x / (w / GRID))))] + (Math.min(GRID - 1, Math.max(0, Math.floor(y / (h / GRID)))) + 1);
const cityRef = o => gridRef(o.cx, o.cy, MM.city.w, MM.city.h);

// dzielnice: środek ciężkości ważony powierzchnią
const DISTRICTS = (() => {
  const g = new Map();
  OS.forEach(o => { if (!g.has(o.district)) g.set(o.district, []); g.get(o.district).push(o); });
  return [...g].map(([name, list]) => {
    const A = list.reduce((s, o) => s + o.areaKm2, 0);
    return { name, list, x: list.reduce((s, o) => s + o.cx * o.areaKm2, 0) / A, y: list.reduce((s, o) => s + o.cy * o.areaKm2, 0) / A, area: A };
  });
})();

/* ---------- pomiar tekstu ---------- */
const ctx = document.createElement('canvas').getContext('2d');
function textW(str, font, spacingEm = 0, px = 12) { ctx.font = font; return ctx.measureText(str).width + spacingEm * px * str.length; }

/* =================================================================
   PLAN — widok z przybliżaniem
================================================================= */
const svg = $('#map'), frame = $('#frame'), ticks = $('#ticks');
const SHEETS = {
  city: { w: MM.city.w, h: MM.city.h, mpu: M_PER_UNIT_CITY, view: null, minK: 0, maxMul: 10 },
  detail: { w: N.w, h: N.h, mpu: M_PER_UNIT_DETAIL, view: null, minK: 0, maxMul: 6 }
};
let FW = 0, FH = 0;
const cur = () => SHEETS[S.mode];

function fitView(sh, pad = 0.015) {
  const W = sh.w * (1 + pad * 2), H = sh.h * (1 + pad * 2);
  const k = Math.min(FW / W, FH / H);
  const vw = FW / k, vh = FH / k;
  return { x: sh.w / 2 - vw / 2, y: sh.h / 2 - vh / 2, w: vw, h: vh, k };
}
function clampView(sh, v) {
  const base = fitView(sh);
  const k = Math.max(base.k, Math.min(base.k * sh.maxMul, v.k));
  const w = FW / k, h = FH / k;
  let x = v.x + (v.w - w) / 2 * (v.k === k ? 0 : 0), y = v.y;
  x = v.x; y = v.y;
  if (w >= sh.w) x = sh.w / 2 - w / 2; else x = Math.max(-w * 0.15, Math.min(sh.w - w * 0.85, x));
  if (h >= sh.h) y = sh.h / 2 - h / 2; else y = Math.max(-h * 0.15, Math.min(sh.h - h * 0.85, y));
  return { x, y, w, h, k };
}
function setView(v, relabel = true) {
  const sh = cur();
  sh.view = clampView(sh, v);
  const { x, y, w, h } = sh.view;
  svg.setAttribute('viewBox', `${x} ${y} ${w} ${h}`);
  drawTicks();
  drawScale();
  if (relabel) scheduleLabels();
}
function zoomAt(px, py, f) {
  const v = cur().view; const k2 = v.k * f;
  const ux = v.x + px / v.k, uy = v.y + py / v.k;
  const w = FW / k2, h = FH / k2;
  setView({ x: ux - px / k2, y: uy - py / k2, w, h, k: k2 });
}
function measure() {
  const r = frame.getBoundingClientRect(); FW = r.width; FH = r.height;
}
function resetView() { setView(fitView(cur())); }

/* ---------- siatka adresowa na marginesie ---------- */
function drawTicks() {
  const sh = cur(), v = sh.view; if (!v) return;
  const r = frame.getBoundingClientRect(), o = ticks.getBoundingClientRect();
  const ox = r.left - o.left, oy = r.top - o.top, band = ox; // szerokość pasa marginesu
  let h = '';
  const cw = sh.w / GRID, ch = sh.h / GRID;
  for (let i = 0; i <= GRID; i++) {
    const sx = ox + (i * cw - v.x) * v.k, sy = oy + (i * ch - v.y) * v.k;
    if (sx > ox + 1 && sx < ox + FW - 1) {
      h += `<i style="left:${sx}px;top:${oy - 7}px;width:1px;height:7px"></i><i style="left:${sx}px;top:${oy + FH}px;width:1px;height:7px"></i>`;
    }
    if (sy > oy + 1 && sy < oy + FH - 1) {
      h += `<i style="top:${sy}px;left:${ox - 7}px;height:1px;width:7px"></i><i style="top:${sy}px;left:${ox + FW}px;height:1px;width:7px"></i>`;
    }
    if (i < GRID) {
      const cx = ox + ((i + .5) * cw - v.x) * v.k, cy = oy + ((i + .5) * ch - v.y) * v.k;
      if (cx > ox + 8 && cx < ox + FW - 8) h += `<span style="left:${cx}px;top:${band / 2}px">${LETTERS[i]}</span><span style="left:${cx}px;top:${oy + FH + band / 2}px">${LETTERS[i]}</span>`;
      if (cy > oy + 8 && cy < oy + FH - 8) h += `<span style="top:${cy}px;left:${band / 2}px">${i + 1}</span><span style="top:${cy}px;left:${ox + FW + band / 2}px">${i + 1}</span>`;
    }
  }
  ticks.innerHTML = h;
}

/* ---------- podziałka ---------- */
function niceLen(m) { const p = Math.pow(10, Math.floor(Math.log10(m))); const n = m / p; return (n >= 5 ? 5 : n >= 2 ? 2 : 1) * p; }
function drawScale() {
  const el = $('#scalebar'); if (!el) return;
  const sh = cur(), v = sh.view; if (!v) return; const mPerPx = sh.mpu / v.k;
  const L = niceLen(mPerPx * 150); const px = L / mPerPx; const segs = 4;
  const unit = L >= 1000 ? 'km' : 'm', show = x => unit === 'km' ? nf1.format(x / 1000) : nf.format(x);
  let bars = '';
  for (let i = 0; i < segs; i++) bars += `<rect x="${(i * px / segs).toFixed(1)}" y="12" width="${(px / segs).toFixed(1)}" height="5" fill="${i % 2 ? '#fff' : '#1B2125'}" stroke="#1B2125" stroke-width="1"></rect>`;
  const lab = (x, t, a) => `<text x="${x.toFixed(1)}" y="9" text-anchor="${a}" font-family="Source Sans 3, sans-serif" font-size="11.5" fill="#465056">${t}</text>`;
  const ratio = Math.round(mPerPx / 0.0002645833 / 1000) * 1000;
  el.innerHTML = `<svg width="${Math.ceil(px + 30)}" height="20" viewBox="-1 0 ${Math.ceil(px + 30)} 20" aria-hidden="true">${bars}${lab(0, '0', 'start')}${lab(px / 2, show(L / 2), 'middle')}${lab(px, show(L) + ' ' + unit, 'start')}</svg><div class="sb-num">skala ekranowa ok. 1:${nf.format(ratio)}</div>`;
}

/* =================================================================
   ARKUSZ: WARSZAWA
================================================================= */
function buildCity() {
  let h = `<rect x="-2000" y="-2000" width="5000" height="5000" fill="#FFFFFF"></rect>`;
  for (const d of DISTRICTS) {
    h += `<g>`;
    h += d.list.map(o => `<path class="dline" d="${o.d}"></path>`).join('');
    h += d.list.map(o => `<path class="os" data-id="${o.id}" d="${o.d}"></path>`).join('');
    h += `</g>`;
  }
  h += `<path class="river-edge" id="riverEdge" d="${MM.city.river}"></path><path class="river" id="riverPath" d="${MM.city.river}"></path>`;
  let gl = '';
  const cw = MM.city.w / GRID, ch = MM.city.h / GRID;
  for (let i = 1; i < GRID; i++) gl += `<path class="gridline" d="M${i * cw} 0V${MM.city.h}"></path><path class="gridline" d="M0 ${i * ch}H${MM.city.w}"></path>`;
  h += `<g>${gl}</g>`;
  h += `<path class="hl-casing" id="selCasing" d=""></path><path class="hl-sel" id="selPath" d=""></path><path class="hl-hover" id="hovPath" d=""></path>`;
  h += `<g id="cityLabels"></g>`;
  $('#cityRoot').innerHTML = h;
  // szerokość Wisły ≈ 330 m w rzeczywistości
  const rw = 330 / M_PER_UNIT_CITY;
  $('#riverPath').setAttribute('stroke-width', rw);
  $('#riverEdge').setAttribute('stroke-width', rw + 2.2);
}
function paintCity() {
  const p = S.profile;
  document.querySelectorAll('#cityRoot .os').forEach(el => { el.style.fill = col(byId[el.dataset.id].match[p]); });
}
function setSelected(id) {
  S.selected = id;
  const o = byId[id];
  $('#selPath').setAttribute('d', o ? o.d : '');
  $('#selCasing').setAttribute('d', o ? o.d : '');
}
function setHover(id) {
  S.hover = id;
  $('#hovPath').setAttribute('d', id && id !== S.selected ? byId[id].d : '');
  document.querySelectorAll('#ixList button').forEach(b => b.classList.toggle('is-hot', b.dataset.id === id));
}

function cityLabels() {
  const v = SHEETS.city.view; if (!v) return;
  const k = v.k, p = S.profile;
  const boxes = [];
  const hit = b => boxes.some(a => !(b[2] < a[0] || b[0] > a[2] || b[3] < a[1] || b[1] > a[3]));
  const inView = (x, y) => x > v.x && x < v.x + v.w && y > v.y && y < v.y + v.h;
  let out = '';
  const fsO = 12.5, fsD = 11, fsSel = 14.5;
  // ramki nakładek (kartusz, objaśnienia, przełączniki) — tam nie stawiamy etykiet
  const fr = frame.getBoundingClientRect();
  ['#legend', '#cartouche', '.modes', '.zoom'].forEach(sel => {
    const e = $(sel); if (!e || e.offsetParent === null) return; const r = e.getBoundingClientRect();
    boxes.push([r.left - fr.left - 4, r.top - fr.top - 4, r.right - fr.left + 4, r.bottom - fr.top + 4]);
  });
  const toS = (x, y) => [(x - v.x) * k, (y - v.y) * k];
  const place = (x, y, w, hgt) => { const [sx, sy] = toS(x, y); const b = [sx - w / 2 - 3, sy - hgt / 2 - 2, sx + w / 2 + 3, sy + hgt / 2 + 2]; if (hit(b)) return false; boxes.push(b); return true; };

  // 1) wybrane osiedle
  const sel = byId[S.selected];
  if (sel && inView(sel.cx, sel.cy)) {
    const w = textW(sel.name, `italic 600 ${fsSel}px "Source Serif 4"`);
    const yOff = 0;
    place(sel.cx, sel.cy + yOff, w, fsSel + 2);
    out += `<text class="lbl lbl-os is-sel" x="${sel.cx}" y="${sel.cy + yOff}" dy=".35em" text-anchor="middle" font-size="${fsSel / k}" stroke-width="${4 / k}">${esc(sel.name)}</text>`;
  }
  // Wisła
  const rp = $('#riverPath');
  if (rp) {
    const L = rp.getTotalLength();
    for (const t of [0.30, 0.62]) {
      const a = rp.getPointAtLength(L * t), b = rp.getPointAtLength(L * t + 14);
      if (!inView(a.x, a.y)) continue;
      let ang = Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI; if (ang > 90) ang -= 180; if (ang < -90) ang += 180;
      const w = textW('Wisła', `italic 500 14px "Source Serif 4"`, .08, 14);
      if (place(a.x, a.y, w * .8, 16)) out += `<text class="lbl lbl-water" x="${a.x}" y="${a.y}" dy=".35em" text-anchor="middle" font-size="${14 / k}" letter-spacing="${1.2 / k}" stroke-width="${0 / k}" transform="rotate(${ang.toFixed(1)} ${a.x} ${a.y})">Wisła</text>`;
    }
  }
  const zoomMul = k / fitView(SHEETS.city).k;
  const pool = OS.filter(o => o.id !== S.selected && inView(o.cx, o.cy));
  const top = pool.filter(o => o.rank[p] <= 10).sort((a, b) => a.rank[p] - b.rank[p]);
  for (const o of top) {
    const w = textW(o.name, `italic 500 ${fsO}px "Source Serif 4"`);
    if (place(o.cx, o.cy, w, fsO + 1)) out += `<text class="lbl lbl-os" x="${o.cx}" y="${o.cy}" dy=".35em" text-anchor="middle" font-size="${fsO / k}" stroke-width="${3 / k}">${esc(o.name)}</text>`;
  }
  // 2) dzielnice — tylko w małej skali
  if (zoomMul < 2.6) {
    for (const d of [...DISTRICTS].sort((a, b) => b.area - a.area)) {
      if (!inView(d.x, d.y)) continue;
      const w = textW(d.name.toUpperCase(), `400 ${fsD}px "Source Serif 4"`, .26, fsD);

/* =================================================================
   ARKUSZ: PLAN SZCZEGÓŁOWY STARYCH BIELAN
================================================================= */
const ROAD_W = { motorway: 9, motorway_link: 3.6, secondary: 6.6, secondary_link: 3.6, tertiary: 5.2, tertiary_link: 3.2, residential: 3.4, unclassified: 3.4, living_street: 2.4 };

const ROAD_RANK = { motorway: 0, secondary: 1, tertiary: 2, residential: 3, unclassified: 3, living_street: 4 };

const PLACES = (() => {
  const list = F.highlights.map(hl => ({ ...hl, xy: (N.places.find(p => p.id === hl.id) || {}).xy })).filter(p => p.xy);
  list.sort((a, b) => a.walkMin - b.walkMin);
  list.forEach((p, i) => p.no = i + 1);
  return list;
})();

// łączenie odcinków ulic w ciągi o tej samej nazwie
const ROAD_CHAINS = (() => {
  const groups = new Map();
  N.roads.forEach(r => {
    if (!r.name || /_link$/.test(r.hw)) return;
    const pts = parsePts(r.d)[0]; if (!pts || pts.length < 2) return;
    if (!groups.has(r.name)) groups.set(r.name, { hw: r.hw, segs: [] });
    const g = groups.get(r.name); g.segs.push(pts);
    if ((ROAD_RANK[r.hw] ?? 5) < (ROAD_RANK[g.hw] ?? 5)) g.hw = r.hw;
  });
  const key = p => p[0].toFixed(1) + ',' + p[1].toFixed(1);
  const out = [];
  for (const [name, g] of groups) {
    const used = new Array(g.segs.length).fill(false);
    for (let i = 0; i < g.segs.length; i++) {
      if (used[i]) continue; used[i] = true; let line = g.segs[i].slice();
      let grown = true;
      while (grown) {
        grown = false;
        for (let j = 0; j < g.segs.length; j++) {
          if (used[j]) continue; const s = g.segs[j];
          const a = key(line[0]), b = key(line[line.length - 1]), s0 = key(s[0]), s1 = key(s[s.length - 1]);
          if (b === s0) line = line.concat(s.slice(1));
          else if (b === s1) line = line.concat(s.slice(0, -1).reverse());
          else if (a === s1) line = s.slice(0, -1).concat(line);
          else if (a === s0) line = s.slice(1).reverse().concat(line);
          else continue;
          used[j] = true; grown = true;
        }
      }
      let L = 0; for (let t = 1; t < line.length; t++) L += Math.hypot(line[t][0] - line[t - 1][0], line[t][1] - line[t - 1][1]);
      // kierunek czytania: od lewej do prawej
      if (line[0][0] > line[line.length - 1][0]) line.reverse();
      out.push({ name, hw: g.hw, pts: line, len: L });
    }
  }
  return out;
})();
function shortName(n) {
  if (/^Aleja /.test(n)) return 'al. ' + n.slice(6);
  if (/^Plac /.test(n)) return 'pl. ' + n.slice(5);
  if (/^Rondo /.test(n)) return 'rondo ' + n.slice(6);
  return n;
}
function surname(n) {
  if (/^(al\.|pl\.|rondo|Zgrupowania|Przy |Starej |Braci )/.test(n) || /[„”"]/.test(n)) return null;
  const w = n.split(' '); return w.length >= 2 ? w[w.length - 1] : null;
}
function chainMid(c) {
  let half = c.len / 2, acc = 0;
  for (let t = 1; t < c.pts.length; t++) {
    const a = c.pts[t - 1], b = c.pts[t], d = Math.hypot(b[0] - a[0], b[1] - a[1]);
    if (acc + d >= half) { const f = (half - acc) / d; return [a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f, Math.atan2(b[1] - a[1], b[0] - a[0])]; }
    acc += d;
  }
  return [c.pts[0][0], c.pts[0][1], 0];
}

function detailBase(idp) {
  let h = `<rect x="-3000" y="-3000" width="7000" height="7000" fill="#F5F6F5"></rect>`;
  h += N.green.map(g => `<path d="${g.d}" fill="${g.kind === 'park' ? '#D2E3BE' : '#E0EBD2'}" stroke="#B9CF9F" stroke-width=".6"></path>`).join('');
  h += N.water.map(d => `<path d="${d}" fill="#BCD7E7" stroke="#8DB7D1" stroke-width=".6"></path>`).join('');
  // ulice: obwiednie, potem wypełnienia
  const byHw = {}; N.roads.forEach(r => (byHw[r.hw] = byHw[r.hw] || []).push(r.d));
  for (const hw of ROAD_ORDER) if (byHw[hw]) h += `<path d="${byHw[hw].join('')}" fill="none" stroke="#A3ABB0" stroke-width="${(ROAD_W[hw] || 3) + 1.6}" stroke-linecap="round" stroke-linejoin="round"></path>`;
  for (const hw of ROAD_ORDER) if (byHw[hw]) h += `<path d="${byHw[hw].join('')}" fill="none" stroke="${ROAD_FILL[hw] || '#FFFFFF'}" stroke-width="${ROAD_W[hw] || 3}" stroke-linecap="round" stroke-linejoin="round"></path>`;
  const low = N.buildings.filter(b => b.h < 20).map(b => b.d).join(''), high = N.buildings.filter(b => b.h >= 20).map(b => b.d).join('');
  h += `<path d="${low}" fill="#C3C8CC" stroke="#A9B0B5" stroke-width=".4"></path>`;
  h += `<path d="${high}" fill="#8E979D" stroke="#7A848A" stroke-width=".4"></path>`;

  h += `<path d="${N.outline}" fill="none" stroke="#C4161C" stroke-width="2.2" stroke-dasharray="9 4" stroke-linejoin="round" vector-effect="non-scaling-stroke"></path>`;

function detailLabels(k, idp, view, avoid = []) {
  const boxes = avoid.slice();
  const hit = b => boxes.some(a => !(b[2] < a[0] || b[0] > a[2] || b[3] < a[1] || b[1] > a[3]));
  const inView = (x, y) => !view || (x > view.x && x < view.x + view.w && y > view.y && y < view.y + view.h);
  const toS = (x, y) => view ? [(x - view.x) * k, (y - view.y) * k] : [x * k, y * k];
  let out = '';
  // miejsca (sygnatury) — rezerwujemy miejsce najpierw
  const r = k > 0.6 ? 11 : 9;
  for (const p of PLACES) { const [sx, sy] = toS(p.xy[0], p.xy[1]); boxes.push([sx - r - 2, sy - r - 2, sx + r + 2, sy + r + 2]); }
  // zieleń z nazwą
  const fsG = k > 0.9 ? 13 : 11;
  N.green.filter(g => g.name).forEach(g => {
    const pts = parsePts(g.d)[0]; const A = ringArea(pts) * k * k; if (A < 2200) return;
    const xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
    const cx = (Math.min(...xs) + Math.max(...xs)) / 2, cy = (Math.min(...ys) + Math.max(...ys)) / 2;
    if (!inView(cx, cy)) return;
    const w = textW(g.name, `italic 500 ${fsG}px "Source Serif 4"`); if (w > Math.sqrt(A) * 2.2) return;
    const [sx, sy] = toS(cx, cy); const b = [sx - w / 2, sy - fsG / 2, sx + w / 2, sy + fsG / 2]; if (hit(b)) return; boxes.push(b);
    out += `<text class="lbl lbl-green" x="${cx}" y="${cy}" dy=".35em" text-anchor="middle" font-size="${fsG / k}" stroke-width="${3 / k}">${esc(g.name)}</text>`;
  });
  // ulice
  const fsR = k > 0.9 ? 11.5 : 10;
  const seen = new Set();
  const chains = ROAD_CHAINS.map((c, i) => ({ ...c, i })).sort((a, b) => (ROAD_RANK[a.hw] ?? 5) - (ROAD_RANK[b.hw] ?? 5) || b.len - a.len);
  for (const c of chains) {
    if (seen.has(c.name)) continue;
    if (k < 0.9 && (ROAD_RANK[c.hw] ?? 5) > 3) continue;
    const m = chainMid(c); if (!inView(m[0], m[1])) continue;
    let label = shortName(c.name), w = textW(label, `500 ${fsR}px "Source Sans 3"`);
    if (w + 24 > c.len * k) { const s = surname(label); if (!s) continue; label = s; w = textW(label, `500 ${fsR}px "Source Sans 3"`); if (w + 24 > c.len * k) continue; }
    const [sx, sy] = toS(m[0], m[1]); const ca = Math.abs(Math.cos(m[2])), sa = Math.abs(Math.sin(m[2]));

    out += `<text class="lbl lbl-road" font-size="${fsR / k}" stroke-width="${2.6 / k}" dy=".34em"><textPath href="#${idp}rc${c.i}" startOffset="50%" text-anchor="middle">${esc(label)}</textPath></text>`;
  }
  // sygnatury miejsc
  for (const p of PLACES) {
    out += `<g class="pm${S.hotPlace === p.id ? ' is-hot' : ''}" data-place="${p.id}" transform="translate(${p.xy[0]} ${p.xy[1]}) scale(${1 / k})"><circle r="${r}" stroke-width="2"></circle><text dy=".36em" font-size="${r > 10 ? 11.5 : 10}">${p.no}</text></g>`;
  }
  return out;
}

    <figure class="photo">
      <div class="photo-main"><img src="${img.src}" alt="${esc(img.alt)}"></div>
      <figcaption><span>${esc(img.alt)}</span><span>${esc(img.credit.replace(/, Wikimedia Commons$/, ''))}</span></figcaption>
      <div class="thumbs" role="group" aria-label="Zdjęcia okolicy">${F.heroImages.map((h, i) => `<button type="button" data-photo="${i}" ${i === S.photo ? 'aria-current="true"' : ''} aria-label="Zdjęcie ${i + 1}: ${esc(h.alt)}"><img src="${h.src}" alt="" loading="lazy"></button>`).join('')}</div>
    </figure>

    <p class="lead">${esc(lead)}</p>
    ${weakTxt ? `<p class="weak"><b>Słabiej:</b> ${esc(weakTxt)}</p>` : ''}

    <section class="sec" aria-labelledby="h-cats"><div class="sec-h"><h3 id="h-cats">Profil okolicy</h3><p>ocena 0–100 na tle miasta</p></div>${catsHtml(F.stats, true)}</section>

    <section class="sec" aria-labelledby="h-places">
      <div class="sec-h"><h3 id="h-places">Miejsca w okolicy</h3><p>czas dojścia pieszo</p></div>
      <div class="inset" id="inset">
        <svg viewBox="${ix} ${iy} ${iw} ${ih}" role="img" aria-label="Plan szczegółowy Starych Bielan z ponumerowanymi miejscami">${detailBase('i')}<g id="insetLabels">${detailLabels(ik, 'i', null)}</g></svg>
      </div>
      <div class="inset-bar"><span>Podkład: © współtwórcy OpenStreetMap</span><button type="button" class="linkbtn" id="openDetail">Otwórz na całym planie</button></div>
      <ul class="places">${PLACES.map(pl => `
        <li data-place="${pl.id}" class="${S.hotPlace === pl.id ? 'is-hot' : ''}">
          <span class="p-no" aria-hidden="true">${pl.no}</span>
          <div><div class="p-name">${esc(pl.name)}</div><div class="p-desc">${esc(MM.categories[pl.category] || '')}. ${esc(pl.description)}</div></div>
          <div class="p-min"><b>${pl.walkMin}</b> min<small>${nf.format(pl.distanceM)} m${pl.distanceTo === 'skraj' ? ' do skraju' : ''}</small></div>
        </li>`).join('')}</ul>
    </section>

    <section class="sec" aria-labelledby="h-commute">
      <div class="sec-h"><h3 id="h-commute">Dojazdy w porannym szczycie</h3><p>przyjazd 7:30–9:00</p></div>
      <table class="tt">
        <thead><tr><th scope="col">Cel</th><th scope="col">Komunikacją</th><th scope="col">Rowerem</th></tr></thead>
        <tbody>${F.commute.map(c => {
          const modes = Object.entries(c.transitByMode).map(([k, v]) => `${{ metro: 'metrem', tramwaj: 'tramwajem', autobus: 'autobusem' }[k]} ${Math.round(v)} min`).join(', ');
          return `<tr><td><div class="dest">${esc(c.label)}</div><div class="modes-line">${modes}</div></td><td class="n">${c.minutes.komunikacja}<small>min</small></td><td class="n">${c.minutes.rower}<small>min</small></td></tr>`;
        }).join('')}</tbody>
      </table>
      <p class="note">Mediana z ${F.commute[0].cells} pól siatki 250 m w osiedlu, według rozkładu ZTM, bez czekania na pierwszy pojazd. Rower: trasa OSRM bez postojów.</p>
    </section>

    <section class="sec" aria-labelledby="h-price">
      <div class="sec-h"><h3 id="h-price">Ceny mieszkań</h3><p>transakcje 01.2024–08.2026</p></div>
      <div class="price-head"><b>${nf.format(pc.buyPerM2)} zł/m²</b><span>o ${nf1.format(diffPct)}% więcej niż mediana Warszawy (${nf.format(pc.cityBuyPerM2)} zł/m²)</span></div>
      <div class="pchart">${priceChart(rc)}</div>
      <p class="note">${esc(pc.basisLabel)}: ${nf.format(rc.msi.n)} aktów notarialnych w osiedlu, ${nf.format(rc.city.n)} w całej Warszawie. Pasek pokazuje środkową połowę transakcji. ${esc(pc.rentNote)}</p>
    </section>

    <section class="sec traffic" aria-labelledby="h-traffic">
      <div class="sec-h"><h3 id="h-traffic">Ruch w ciągu doby</h3><p>indeks spowolnienia 0–100</p></div>
      ${trafficChart(F.traffic)}
      <p class="note">${esc(F.trafficRoad)}. Najwięcej o ${maxH}:00 (${maxT} na 100), czyli płynnie przez całą dobę.</p>
    </section>

    <section class="sec" aria-labelledby="h-tl">
      <div class="sec-h"><h3 id="h-tl">Zmiany w okolicy</h3><p>2026–2040</p></div>
      <div class="tl-key"><span><i class="b" aria-hidden="true"></i>w budowie</span><span><i aria-hidden="true"></i>planowana</span></div>
      <ol class="tl">${[...F.timeline].sort((a, b) => a.year - b.year || (a.yearUncertain ? 1 : 0) - (b.yearUncertain ? 1 : 0)).map(t => `
        <li>
          <div class="tl-year">${t.yearPlacement === 'bez terminu' ? '<span style="font-size:15px">bez terminu</span>' : t.year}${t.yearUncertain && t.yearPlacement !== 'bez terminu' ? '<small>termin niepewny</small>' : ''}</div>
          <span class="tl-dot ${t.status === 'w budowie' ? 'is-build' : ''}" aria-hidden="true"></span>
          <div><div class="tl-title">${esc(t.title)}</div>
            <div class="tl-st"><b>${esc(t.status)}</b>, ${esc(MM.categories[t.category] || '').toLowerCase()}</div>
            <div class="tl-desc">${esc(t.description)}</div></div>
        </li>`).join('')}</ol>
    </section>

    <section class="sec" aria-labelledby="h-offers">
      <div class="sec-h"><h3 id="h-offers">Ogłoszenia w tej okolicy</h3></div>
      <div class="portals">${F.portals.map(pt => `<span>${esc(pt.name)}</span><a href="${pt.buyUrl}" target="_blank" rel="noopener">kupno</a><a href="${pt.rentUrl}" target="_blank" rel="noopener">wynajem</a>`).join('')}</div>
    </section>

    <div class="colophon">
      <p><b style="color:#465056;font-weight:600">O danych.</b> Wszystkie liczby pochodzą z otwartych danych: ${esc(MM.credits.replace(/^Dane:\s*/, '').replace(/ · /g, ', '))}. Oceny kategorii to pozycja osiedla na tle 143 osiedli Warszawy (0–100).</p>
      <p>${esc(pc.sourceNote.split('. Obszar MSI')[0])}.</p>
    </div>
  </div>`;
}

function priceChart(rc) {
  const W = 398, x0 = 12000, x1 = 20000, sx = v => 86 + (v - x0) / (x1 - x0) * (W - 96);
  const row = (y, lab, d, dark, below) => `
    <text class="pl" x="0" y="${y + 4}">${lab}</text>
    <line x1="${sx(d.p25)}" x2="${sx(d.p75)}" y1="${y}" y2="${y}" stroke="${dark ? '#5C8641' : '#B3BABE'}" stroke-width="10"></line>
    <line x1="${sx(d.med)}" x2="${sx(d.med)}" y1="${y - 9}" y2="${y + 9}" stroke="#1B2125" stroke-width="2.5"></line>
    <text x="${sx(d.med)}" y="${below ? y + 23 : y - 14}" text-anchor="middle" style="fill:#1B2125;font-weight:600">${nf.format(d.med)}</text>
    <text x="${sx(d.p25) - 6}" y="${y + 4}" text-anchor="end">${nf.format(d.p25)}</text>
    <text x="${sx(d.p75) + 6}" y="${y + 4}" text-anchor="start">${nf.format(d.p75)}</text>`;
  let ax = ''; for (let v = 12000; v <= 20000; v += 2000) ax += `<line x1="${sx(v)}" x2="${sx(v)}" y1="86" y2="91" stroke="#1B2125"></line><text x="${sx(v)}" y="104" text-anchor="middle">${nf.format(v / 1000)} tys.</text>`;
  return `<svg viewBox="0 0 ${W} 108" role="img" aria-label="Stare Bielany: mediana ${nf.format(rc.msi.med)} zł/m², kwartyle ${nf.format(rc.msi.p25)}–${nf.format(rc.msi.p75)}. Warszawa: mediana ${nf.format(rc.city.med)} zł/m², kwartyle ${nf.format(rc.city.p25)}–${nf.format(rc.city.p75)}.">
    ${row(28, 'Stare Bielany', rc.msi, true, false)}${row(56, 'Warszawa', rc.city, false, true)}
    <line x1="${sx(x0)}" x2="${sx(x1)}" y1="86" y2="86" stroke="#1B2125"></line>${ax}
  </svg>`;
}
function trafficChart(t) {
  const W = 398, H = 92, top = 6, base = 66, bw = (W - 30) / 24, y = v => base - v / 100 * (base - top);
  let g = '';
  [[35, 'umiarkowanie'], [65, 'duże korki']].forEach(([v, l]) => g += `<line x1="30" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="#DADEE0" stroke-dasharray="3 3"></line><text x="${W}" y="${y(v) - 4}" text-anchor="end">${l}</text>`);
  g += `<text x="24" y="${y(100) + 8}" text-anchor="end">100</text><text x="24" y="${base}" text-anchor="end">0</text>`;
  t.forEach((v, h) => { const x = 30 + h * bw; g += `<rect x="${x + 1}" y="${y(v)}" width="${bw - 2}" height="${Math.max(0, base - y(v))}" fill="#5C8641"><title>${h}:00, ${v} na 100</title></rect>`; });
  g += `<line x1="30" x2="${W}" y1="${base}" y2="${base}" stroke="#1B2125"></line>`;
  [0, 6, 12, 18].forEach(h => g += `<text x="${30 + h * bw}" y="${base + 16}">${h}:00</text>`);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Indeks spowolnienia w ciągu doby, maksimum ${Math.max(...t)} na 100">${g}</svg>`;
}

function renderSheet() {
  if (S.selected === F.slug) renderFeatured(); else renderCompact(byId[S.selected]);
}

/* =================================================================
   TOOLTIP
================================================================= */
const tip = $('#tip');
function showTip(e, html) {
  const r = frame.getBoundingClientRect();
  tip.innerHTML = html; tip.classList.add('on');
  let x = e.clientX - r.left, y = e.clientY - r.top;
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  if (x + tw + 24 > r.width) x -= tw + 28;
  if (y + th + 24 > r.height) y -= th + 28;
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
}
function hideTip() { tip.classList.remove('on'); }
function osTip(o) {
  const p = S.profile;
  return `<b>${esc(o.name)}</b><small>${esc(o.district)}, pole ${cityRef(o)}</small>
    <div class="tip-row"><i style="background:${col(o.match[p])}"></i><span>Dopasowanie <strong>${o.match[p]}</strong>, ${o.rank[p]}. miejsce ze ${OS.length}</span></div>`;
}

/* =================================================================
   ZDARZENIA
================================================================= */
function select(id, { focusSheet = false } = {}) {
  setSelected(id); setHover(null); S.photo = 0;
  renderSheet(); drawIndex(); scheduleLabels();
  $('#sheet').scrollTop = 0;
  if (focusSheet) $('#sheet').focus({ preventScroll: true });
}
function setProfile(p) {
  S.profile = p;
  document.querySelectorAll('.seg button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.p === p)));
  $('#profileDesc').textContent = MM.profiles[p].description;
  paintCity(); drawIndex(); drawOverlays(); renderSheet(); scheduleLabels();
}
function setMode(m) {
  if (S.mode === m) return;
  S.mode = m;
  document.querySelectorAll('.modes button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === m)));
  $('#cityRoot').style.display = m === 'city' ? '' : 'none';
  $('#detailRoot').style.display = m === 'detail' ? '' : 'none';
  $('#mapTitle').textContent = m === 'city' ? 'Plan Warszawy: 143 osiedla pokolorowane według dopasowania do wybranego profilu' : 'Plan szczegółowy Starych Bielan: budynki, ulice, zieleń i miejsca z arkusza';
  hideTip(); drawOverlays();
  setView(SHEETS[m].view || fitView(SHEETS[m]));
}

// przeciąganie i przybliżanie
let drag = null;
svg.addEventListener('pointerdown', e => {
  if (e.button !== 0) return;
  drag = { x: e.clientX, y: e.clientY, v: { ...cur().view }, moved: false, id: e.pointerId };
});
svg.addEventListener('pointermove', e => {
  if (drag && drag.id === e.pointerId) {
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!drag.moved && Math.hypot(dx, dy) > 4) { drag.moved = true; svg.setPointerCapture(e.pointerId); svg.classList.add('is-drag'); hideTip(); }
    if (drag.moved) { const v = drag.v; setView({ ...v, x: v.x - dx / v.k, y: v.y - dy / v.k }); return; }
  }
  if (S.mode === 'city') {
    const t = e.target.closest && e.target.closest('.os');
    const id = t ? t.dataset.id : null;
    if (id !== S.hover) setHover(id);
    if (id) showTip(e, osTip(byId[id])); else hideTip();
  } else {
    const t = e.target.closest && e.target.closest('.pm');
    if (t) { const pl = PLACES.find(q => q.id === t.dataset.place); showTip(e, `<b>${pl.no}. ${esc(pl.name)}</b><small>${esc(MM.categories[pl.category])}</small><div class="tip-row">${pl.walkMin} min pieszo, ${nf.format(pl.distanceM)} m</div>`); }
    else hideTip();
  }
});
svg.addEventListener('pointerup', e => {
  if (!drag) return; const was = drag; drag = null; svg.classList.remove('is-drag');
  if (was.moved) return;
  if (S.mode === 'city') {
    const t = e.target.closest && e.target.closest('.os'); if (t) select(t.dataset.id);
  } else {
    const t = e.target.closest && e.target.closest('.pm'); if (t) hotPlace(t.dataset.place, true);
  }
});
svg.addEventListener('pointerleave', () => { if (!drag) { setHover(null); hideTip(); } });
svg.addEventListener('wheel', e => {
  e.preventDefault(); const r = svg.getBoundingClientRect();
  zoomAt(e.clientX - r.left, e.clientY - r.top, Math.exp(-e.deltaY * 0.0018));
}, { passive: false });
$('#zIn').addEventListener('click', () => zoomAt(FW / 2, FH / 2, 1.6));
$('#zOut').addEventListener('click', () => zoomAt(FW / 2, FH / 2, 1 / 1.6));
$('#zReset').addEventListener('click', resetView);
document.querySelectorAll('.modes button').forEach(b => b.addEventListener('click', () => setMode(b.dataset.mode)));
document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => setProfile(b.dataset.p)));
$('#ixSearch').addEventListener('input', drawIndex);
$('#ixList').addEventListener('click', e => {
  const b = e.target.closest('button[data-id]'); if (!b) return;
  if (S.mode !== 'city') setMode('city');
  select(b.dataset.id);
  // jeśli osiedle poza widokiem — przesuń plan
  const o = byId[b.dataset.id], v = SHEETS.city.view;
  if (o.cx < v.x || o.cx > v.x + v.w || o.cy < v.y || o.cy > v.y + v.h) setView({ ...v, x: o.cx - v.w / 2, y: o.cy - v.h / 2 });
});
$('#ixList').addEventListener('pointerover', e => { const b = e.target.closest('button[data-id]'); if (b && S.mode === 'city') setHover(b.dataset.id); });
$('#ixList').addEventListener('pointerleave', () => setHover(null));
$('#ixList').addEventListener('focusin', e => { const b = e.target.closest('button[data-id]'); if (b && S.mode === 'city') setHover(b.dataset.id); });

function hotPlace(id, scroll) {
  S.hotPlace = id;
  document.querySelectorAll('.pm').forEach(g => g.classList.toggle('is-hot', g.dataset.place === id));
  document.querySelectorAll('.places li').forEach(li => li.classList.toggle('is-hot', li.dataset.place === id));
  if (scroll && id) { const li = document.querySelector(`.places li[data-place="${id}"]`); if (li) li.scrollIntoView({ block: 'nearest', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); }
}
$('#sheet').addEventListener('click', e => {
  const g = e.target.closest('[data-goto]'); if (g) { select(g.dataset.goto); return; }
  const ph = e.target.closest('[data-photo]');
  if (ph) {
    S.photo = +ph.dataset.photo; const img = F.heroImages[S.photo];
    const m = $('.photo-main img'); m.src = img.src; m.alt = img.alt;
    const cap = document.querySelectorAll('.photo figcaption span'); cap[0].textContent = img.alt; cap[1].textContent = img.credit.replace(/, Wikimedia Commons$/, '');
    document.querySelectorAll('.thumbs button').forEach(b => b.toggleAttribute('aria-current', +b.dataset.photo === S.photo));
    document.querySelectorAll('.thumbs button[aria-current]').forEach(b => b.setAttribute('aria-current', 'true'));
    return;
  }
  if (e.target.closest('#openDetail')) { setMode('detail'); return; }
});
$('#sheet').addEventListener('pointerover', e => { const li = e.target.closest('.places li, .pm'); hotPlace(li ? li.dataset.place : null, false); });

/* ---------- start ---------- */
buildCity(); buildDetail();
setSelected(S.selected);
paintCity();
$('#profileDesc').textContent = MM.profiles[S.profile].description;
drawIndex(); drawOverlays(); renderSheet();
measure();
SHEETS.city.view = fitView(SHEETS.city);
setView(SHEETS.city.view);
new ResizeObserver(() => {
  const old = cur().view; measure();
  ['city', 'detail'].forEach(m => { const sh = SHEETS[m]; if (sh.view) { const f = fitView(sh); sh.view = f; } });
  setView(cur().view);
}).observe(frame);
if (/detail/.test(location.hash)) setMode('detail');
const hp = (location.hash.match(/p=(\w+)/) || [])[1]; if (hp && MM.profiles[hp]) setProfile(hp);
const hs = (location.hash.match(/s=([\w-]+)/) || [])[1]; if (hs && byId[hs]) select(hs);
document.fonts && document.fonts.ready.then(() => { scheduleLabels(); });
})();
</script>
</body>
</html>
