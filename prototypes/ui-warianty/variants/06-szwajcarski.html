<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moje Miejsce — Stare Bielany</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&amp;display=swap&amp;subset=latin-ext" rel="stylesheet">
<style>
/*
  Wariant 06 — „Szwajcarski”
  Tokeny:
    kolor   #FFFFFF papier · #111111 tusz · #E30613 czerwień sygnałowa · #EDEDED płaszczyzna
            #575757 tekst drugorzędny · rampa mapy #EDEDED #CFCFCF #A6A6A6 #6B6B6B #262626
    pismo   Archivo (oś wdth 62–125): 125 = Expanded do liczb i nazw, 75 = Condensed do danych, 100 = tekst
    siatka  12 kolumn × 94 px, łam 24 px, margines 24 px, rytm pionowy 8 px
*/
:root{
  --paper:#FFFFFF; --ink:#111111; --red:#E30613; --plane:#EDEDED; --ink2:#575757;
  --m0:#EDEDED; --m1:#CFCFCF; --m2:#A6A6A6; --m3:#6B6B6B; --m4:#262626;
  --col:94px; --gut:24px; --mar:24px; --u:8px;
  --head:72px;
  --wide:125%; --cond:75%;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:"Archivo", "Helvetica Neue", Arial, sans-serif;
  font-stretch:100%;
  color:var(--ink); background:var(--paper);
  font-size:15px; line-height:24px;
  font-variant-numeric:tabular-nums lining-nums;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:left}
a{color:inherit}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- frame ---------- */
.app{
  display:grid;
  grid-template-columns:repeat(12,var(--col));
  column-gap:var(--gut);
  padding:0 var(--mar);
  grid-template-rows:var(--head) calc(100vh - var(--head));
  width:100%; max-width:1440px; margin:0 auto;
  height:100vh;
}
@media (min-width:1100px){
  .app{grid-template-columns:repeat(12,minmax(0,1fr))}
}

/* ---------- header ---------- */
.top{display:contents}
.brand{grid-column:1 / span 3;display:flex;align-items:center;gap:12px;align-self:center}
.brand-mark{width:24px;height:24px;background:var(--red);flex:none}
.brand-name{font-stretch:var(--wide);font-weight:800;font-size:20px;letter-spacing:-.01em;line-height:24px}
.lede{grid-column:4 / span 3;align-self:center;color:var(--ink2);font-size:13px;line-height:18px;max-width:300px}

.profiles{grid-column:7 / span 3;align-self:center;display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.profiles button{
  height:40px;padding:0 12px;background:var(--plane);
  font-weight:600;font-size:15px;display:flex;align-items:center;
  transition:background-color .15s, color .15s;
}
.profiles button:hover{background:#DCDCDC}
.profiles button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.headnote{grid-column:10 / span 3;align-self:center;font-size:13px;line-height:18px;color:var(--ink2)}
.headnote b{color:var(--ink);font-weight:700}

/* ---------- card column ---------- */
.card{
  grid-column:1 / span 6; grid-row:2;
  overflow-y:auto; overflow-x:hidden;
  scrollbar-width:thin; scrollbar-color:var(--m2) transparent;
  padding-top:16px;
  overscroll-behavior:contain;
}
.card-inner{padding-bottom:96px}

.meta{display:flex;gap:24px;font-size:15px;line-height:24px;color:var(--ink2);margin-bottom:8px}
.meta b{color:var(--ink);font-weight:600}
.name{
  font-stretch:var(--wide);font-weight:800;
  font-size:84px;line-height:80px;letter-spacing:-.035em;
  margin:0 0 32px -4px;
  text-wrap:balance;
  hyphens:none;
}
.name.long{font-size:64px;line-height:60px}

/* the match plane: the red plane IS the bar (width = match %) */
.score{position:relative;height:296px;background:var(--plane);overflow:hidden}
.score-fill{position:absolute;inset:0 auto 0 0;background:var(--red);transition:width .5s cubic-bezier(.2,.7,.2,1)}
.score-num{
  position:absolute;left:0;right:0;bottom:-55px;padding-left:12px;
  font-stretch:var(--wide);font-weight:800;
  font-size:348px;line-height:348px;letter-spacing:-.06em;
  color:var(--ink); white-space:nowrap;
}
.score-num.on{color:var(--paper)}
.score-label{position:absolute;left:24px;top:16px;font-size:15px;font-weight:600;line-height:24px;color:var(--ink)}
.score-label.on{color:var(--paper)}
.score-max{position:absolute;right:16px;top:16px;font-size:15px;font-weight:600;color:var(--ink)}
.scale{display:flex;justify-content:space-between;font-size:12px;line-height:16px;color:var(--ink2);margin-top:8px;font-stretch:var(--cond)}

.facts{display:grid;grid-template-columns:repeat(6,1fr);column-gap:var(--gut);margin-top:32px}
.rank{grid-column:1 / span 2}
.rank-num{font-stretch:var(--wide);font-weight:800;font-size:64px;line-height:56px;letter-spacing:-.04em}
.rank-txt{font-size:15px;line-height:20px;margin-top:8px;color:var(--ink2)}
.rank-txt b{color:var(--ink);font-weight:600}
.summary{grid-column:3 / span 4;font-size:21px;line-height:28px;font-weight:500;letter-spacing:-.005em;text-wrap:pretty}
.summary small{display:block;margin-top:12px;font-size:15px;line-height:22px;font-weight:400;color:var(--ink2)}

/* photos */
.photos{margin-top:48px}
.photo-main{position:relative;width:100%;aspect-ratio:3/2;background:var(--plane);overflow:hidden}
.photo-main img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs{display:grid;grid-template-columns:repeat(6,1fr);column-gap:var(--gut);margin-top:var(--gut)}
.thumbs button{aspect-ratio:1;overflow:hidden;background:var(--plane);position:relative}
.thumbs img{width:100%;height:100%;object-fit:cover;display:block;filter:grayscale(1);transition:filter .2s}
.thumbs button:hover img,.thumbs button[aria-current="true"] img{filter:none}
.thumbs button[aria-current="true"]::after{content:"";position:absolute;left:0;right:0;bottom:0;height:8px;background:var(--red)}
.caption{display:grid;grid-template-columns:repeat(6,1fr);column-gap:var(--gut);margin-top:12px;font-size:13px;line-height:18px}
.caption p:first-child{grid-column:1 / span 4;font-weight:600}
.caption p:last-child{grid-column:5 / span 2;color:var(--ink2)}

/* sections: hanging title column (2 cols) + content (4 cols) */
.sec{display:grid;grid-template-columns:repeat(6,1fr);column-gap:var(--gut);margin-top:88px}
.sec-head{grid-column:1 / span 2}
.sec-head::before{content:"";display:block;width:48px;height:8px;background:var(--ink);margin-bottom:16px}
.sec-head h2{font-stretch:var(--wide);font-weight:800;font-size:22px;line-height:26px;letter-spacing:-.015em}
.sec-head p{font-size:13px;line-height:18px;color:var(--ink2);margin-top:12px}
.sec-head p b{color:var(--ink);font-weight:600}
.sec-body{grid-column:3 / span 4}

/* categories */
.cats{display:grid;row-gap:16px}
.cat{display:grid;grid-template-columns:1fr 64px;column-gap:16px;align-items:end}
.cat-l{font-size:15px;line-height:20px;font-weight:600;display:flex;justify-content:space-between;gap:8px}
.cat-l em{font-style:normal;font-weight:600;font-size:12px;color:var(--red)}
.cat-bar{grid-column:1;height:16px;background:var(--plane);margin-top:6px;position:relative}
.cat-bar i{position:absolute;inset:0 auto 0 0;background:var(--ink);transition:width .5s cubic-bezier(.2,.7,.2,1)}
.cat.prio .cat-bar i{background:var(--red)}
.cat-v{grid-column:2;grid-row:1 / span 2;font-stretch:var(--cond);font-weight:800;font-size:44px;line-height:38px;text-align:right;letter-spacing:-.02em}
.cat.prio .cat-v{color:var(--red)}

/* places */
.places{display:grid}
.place{display:grid;grid-template-columns:88px 1fr 28px;column-gap:16px;padding:12px 0;align-items:start;width:100%}
.place + .place{border-top:2px solid var(--plane)}
.place:hover .place-n,.place:focus-visible .place-n,.place.hot .place-n{background:var(--red);color:var(--paper)}
.place-min{font-stretch:var(--cond);font-weight:800;font-size:44px;line-height:38px;letter-spacing:-.02em}
.place-min span{font-size:15px;font-weight:600;letter-spacing:0;margin-left:4px;font-stretch:100%}
.place-t{font-size:15px;line-height:20px;font-weight:600}
.place-d{font-size:13px;line-height:18px;color:var(--ink2);margin-top:2px}
.place-n{width:28px;height:28px;background:var(--ink);color:var(--paper);font-size:13px;font-weight:700;display:grid;place-items:center;transition:background-color .15s}
.btn{display:inline-flex;align-items:center;gap:10px;height:40px;padding:0 16px;background:var(--ink);color:var(--paper);font-weight:600;font-size:15px;text-decoration:none}
.btn:hover{background:var(--red)}
.btn.ghost{background:var(--plane);color:var(--ink)}
.btn.ghost:hover{background:#DCDCDC}
.btn svg{flex:none}

/* commute */
.commute{display:grid;row-gap:28px}
.cm-t{font-size:15px;line-height:20px;font-weight:600;margin-bottom:8px}
.cm-row{display:grid;grid-template-columns:96px 1fr 64px;column-gap:16px;align-items:center;height:32px}
.cm-row span{font-size:13px;color:var(--ink2)}
.cm-bar{height:16px;background:var(--plane);position:relative}
.cm-bar i{position:absolute;inset:0 auto 0 0;background:var(--ink)}
.cm-row.bike .cm-bar i{background:var(--m2)}
.cm-v{font-stretch:var(--cond);font-weight:800;font-size:32px;line-height:32px;text-align:right;letter-spacing:-.02em}
.cm-v small{font-size:13px;font-weight:600;letter-spacing:0;font-stretch:100%;margin-left:2px}
.cm-modes{font-size:13px;line-height:18px;color:var(--ink2);margin-top:6px}
.axis{display:grid;grid-template-columns:96px 1fr 64px;column-gap:16px;font-size:12px;line-height:16px;color:var(--ink2);font-stretch:var(--cond)}
.axis div{display:flex;justify-content:space-between}

.routes{margin-top:48px}
.routes h3{font-size:15px;line-height:20px;font-weight:700;margin-bottom:8px}
.rt,.rt-head{display:grid;grid-template-columns:96px 1fr 64px 64px;column-gap:16px;align-items:baseline}
.rt-head span{font-size:12px;line-height:16px;color:var(--ink2);text-align:right}
.rt{padding:6px 0;font-size:14px;line-height:20px;border-top:2px solid var(--plane)}
.rt-head + .rt{border-top-color:var(--ink)}
.rt .rt-g{font-size:13px;color:var(--ink2)}
.rt b{font-stretch:var(--cond);font-weight:800;font-size:22px;line-height:20px;text-align:right}
.rt b small{font-size:12px;font-weight:600;font-stretch:100%;margin-left:2px}
.rt b.bk{color:var(--ink2)}

/* prices */
.price-big{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.price-big strong{font-stretch:var(--wide);font-weight:800;font-size:56px;line-height:56px;letter-spacing:-.04em}
.price-big span{font-size:15px;font-weight:600}
.price-cmp{display:grid;grid-template-columns:1fr 1fr;column-gap:var(--gut);margin-top:16px}
.price-cmp div{font-size:13px;line-height:18px;color:var(--ink2)}
.price-cmp b{display:block;font-stretch:var(--cond);font-weight:800;font-size:32px;line-height:34px;color:var(--ink);letter-spacing:-.02em}
.price-cmp .up b{color:var(--red)}
.range{margin-top:32px}
.rg-row{display:grid;grid-template-columns:120px 1fr;column-gap:16px;align-items:center;height:40px}
.rg-row span{font-size:13px;line-height:16px;font-weight:600}
.rg-row span small{display:block;font-weight:400;color:var(--ink2)}
.rg-track{position:relative;height:24px}
.rg-iqr{position:absolute;top:0;bottom:0;background:var(--m1)}
.rg-row.own .rg-iqr{background:var(--red)}
.rg-med{position:absolute;top:-6px;bottom:-6px;width:4px;margin-left:-2px;background:var(--ink)}
.rg-axis{display:grid;grid-template-columns:120px 1fr;column-gap:16px;margin-top:4px}
.rg-axis div{position:relative;height:16px;font-size:12px;line-height:16px;color:var(--ink2);font-stretch:var(--cond)}
.rg-axis div span{position:absolute;transform:translateX(-50%);white-space:nowrap}
.rg-axis div span:last-child{transform:translateX(-100%)}
.note{font-size:13px;line-height:18px;color:var(--ink2);margin-top:16px}

/* traffic */
.traffic{display:grid;grid-template-columns:28px 1fr;column-gap:8px}
.tr-y{position:relative;height:144px;font-size:12px;color:var(--ink2);font-stretch:var(--cond)}
.tr-y span{position:absolute;right:0;transform:translateY(-50%);line-height:12px}
.tr-plot{position:relative;height:144px;display:grid;grid-template-columns:repeat(24,1fr);column-gap:3px;align-items:end;background:linear-gradient(var(--plane),var(--plane)) 0 100%/100% 2px no-repeat}
.tr-plot i{display:block;background:var(--ink);min-height:0}
.tr-plot i.peak{background:var(--red)}
.tr-th{position:absolute;left:0;right:0;height:0;border-top:2px dashed var(--m2)}
.tr-th span{position:absolute;right:0;top:-20px;font-size:12px;line-height:16px;color:var(--ink2);background:var(--paper);padding-left:6px}
.tr-x{grid-column:2;display:grid;grid-template-columns:repeat(4,1fr);font-size:12px;line-height:16px;color:var(--ink2);margin-top:6px;font-stretch:var(--cond)}
.tr-x span:last-child{display:flex;justify-content:space-between}

/* timeline */
.tl{display:grid}
.tl-item{display:grid;grid-template-columns:112px 1fr;column-gap:16px;padding:16px 0}
.tl-item + .tl-item{border-top:2px solid var(--plane)}
.tl-year{font-stretch:var(--cond);font-weight:800;font-size:40px;line-height:36px;letter-spacing:-.02em}
.tl-year.soft{color:var(--m2)}
.tl-year small{display:block;font-size:12px;line-height:16px;font-weight:600;color:var(--ink2);letter-spacing:0;margin-top:6px;font-stretch:100%}
.tl-t{font-size:15px;line-height:20px;font-weight:700}
.tl-d{font-size:13px;line-height:18px;color:var(--ink2);margin-top:4px}
.tl-n{font-size:12px;line-height:16px;color:var(--ink2);margin-top:8px}
.tag{display:inline-block;font-size:12px;line-height:20px;font-weight:700;padding:0 8px;margin-bottom:8px;background:var(--plane)}
.tag.live{background:var(--red);color:var(--paper)}

.portals{display:grid;grid-template-columns:1fr 1fr;gap:2px}
.portals .btn{justify-content:space-between}

.credits{font-size:12px;line-height:17px;color:var(--ink2)}
.credits p + p{margin-top:8px}
.credits b{color:var(--ink);font-weight:600}

.back{margin-top:40px}
.compact-note{font-size:13px;line-height:18px;color:var(--ink2);margin-top:16px}

/* ---------- map column ---------- */
.mapzone{grid-column:7 / span 6;grid-row:2;position:relative;overflow:hidden}
.mapwrap{position:absolute;left:0;right:0;bottom:24px;top:16px;display:flex;align-items:flex-end;justify-content:flex-start}
.mapwrap svg{display:block;width:100%;height:100%}
.osd{stroke:var(--paper);stroke-width:1.4;stroke-linejoin:round;cursor:pointer;transition:fill .35s}
.osd.c0{fill:var(--m0)}.osd.c1{fill:var(--m1)}.osd.c2{fill:var(--m2)}.osd.c3{fill:var(--m3)}.osd.c4{fill:var(--m4)}
.osd.sel{fill:var(--red)}
.osd:hover,.osd.hov{stroke:var(--red);stroke-width:4;paint-order:stroke}
.osd.sel:hover{stroke:var(--ink)}
.osd:focus{outline:none}
.osd:focus-visible{stroke:var(--ink);stroke-width:5}
.river{fill:none;stroke:var(--paper);stroke-width:7;stroke-linecap:round;pointer-events:none}
.river-l{font-size:15px;font-weight:600;fill:var(--ink2);font-style:normal;pointer-events:none}

.maplabel{position:absolute;pointer-events:none;display:flex;align-items:center}
.maplabel i{display:block;width:32px;height:3px;background:var(--ink)}
.maplabel span{background:var(--ink);color:var(--paper);font-size:13px;line-height:16px;font-weight:700;padding:6px 8px;white-space:nowrap}
.maplabel span b{font-stretch:var(--cond);font-weight:800;font-size:16px;margin-left:6px;color:var(--paper)}

.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--paper);padding:8px 12px;min-width:160px;opacity:0;transition:opacity .1s;z-index:5}
.tip.on{opacity:1}
.tip-n{font-size:15px;line-height:20px;font-weight:700}
.tip-d{font-size:12px;line-height:16px;color:#C9C9C9}
.tip-m{display:flex;align-items:baseline;gap:8px;margin-top:4px}
.tip-m b{font-stretch:var(--cond);font-weight:800;font-size:32px;line-height:30px}
.tip-m span{font-size:12px;line-height:16px;color:#C9C9C9}

.ranking{position:absolute;top:16px;right:0;width:calc(2 * (100% - 5 * var(--gut)) / 6 + var(--gut));z-index:2}
.ranking h2{font-stretch:var(--wide);font-weight:800;font-size:15px;line-height:20px;margin-bottom:8px}
.ranking .rk-sub{font-size:13px;line-height:18px;color:var(--ink2);margin:-6px 0 10px}
.ranking ol{list-style:none}
.ranking button{display:grid;grid-template-columns:24px 1fr 28px;column-gap:8px;width:100%;font-size:14px;line-height:20px;padding:0 4px 0 0;font-stretch:var(--cond);font-weight:500}
.ranking button:hover{background:var(--plane)}
.ranking button[aria-current="true"]{background:var(--red);color:var(--paper)}
.ranking .r{font-stretch:var(--cond);font-weight:700;text-align:right}
.ranking .m{font-stretch:var(--cond);font-weight:800;text-align:right;font-size:15px}
.ranking .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.legend{position:absolute;left:0;bottom:24px;z-index:2;width:calc(2 * (100% - 5 * var(--gut)) / 6 + var(--gut))}
.legend h2{font-size:13px;line-height:18px;font-weight:700;margin-bottom:8px}
.legend ul{list-style:none;display:grid;row-gap:2px}
.legend li{display:grid;grid-template-columns:40px 1fr;column-gap:10px;align-items:center;font-size:13px;line-height:20px;font-stretch:var(--cond);font-weight:600}
.legend li i{display:block;height:20px}

.mapctl{position:absolute;right:0;bottom:24px;z-index:2;display:grid;justify-items:end;row-gap:12px}
.views{display:grid;grid-template-columns:1fr 1fr;gap:2px;width:220px}
.views button{height:40px;padding:0 12px;background:var(--plane);font-weight:600;font-size:15px}
.views button:hover{background:#DCDCDC}
.views button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.mapcred{font-size:11px;line-height:15px;color:var(--ink2);text-align:right;max-width:240px}
.gridbtn{font-size:12px;line-height:16px;color:var(--ink2);text-decoration:underline;text-underline-offset:3px}
.gridbtn:hover{color:var(--ink)}

/* neighbourhood plan */
.mapzone.is-plan .legend{top:16px;bottom:auto}
.mapzone.is-plan .mapctl{top:16px;bottom:auto}
.plan .bld{fill:var(--ink)}
.plan .grn{fill:#DCDCDC}
.plan .wtr{fill:var(--m2)}
.plan .rd{fill:none;stroke:var(--m1);stroke-linecap:round;stroke-linejoin:round}
.plan .outl{fill:none;stroke:var(--red);stroke-width:6;stroke-linejoin:round}
.plan .pin rect{fill:var(--red)}
.plan .pin text{fill:var(--paper);font-size:22px;font-weight:800;text-anchor:middle;dominant-baseline:central;font-family:Archivo, Arial, sans-serif}
.plan .pin.hot rect{fill:var(--ink)}
.plan .pin{cursor:pointer}

/* grid overlay */
.gridov{position:fixed;inset:0;pointer-events:none;z-index:50;display:none}
.gridov.on{display:block}
.gridov div{max-width:1440px;margin:0 auto;height:100%;padding:0 var(--mar);display:grid;grid-template-columns:repeat(12,1fr);column-gap:var(--gut)}
.gridov span{background:rgba(227,6,19,.08)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}
}

/* ---------- small screens ---------- */
@media (max-width:1099px){
  body{overflow:auto}
  .app{display:flex;flex-direction:column;height:auto;padding:0 16px}
  .top{display:grid;grid-template-columns:1fr;row-gap:16px;padding:20px 0 16px;order:1}
  .mapzone{order:2;display:flex;flex-direction:column}
  .mapwrap{order:1}.legend{order:2}.ranking{order:3}.mapctl{order:4}
  .card{order:3}
  .tip,.maplabel{display:none}
  .mapcred{text-align:left}
  .legend ul{grid-template-columns:repeat(3,1fr);column-gap:12px}
  .legend li{grid-template-columns:24px 1fr;column-gap:8px}
  .brand,.lede,.profiles,.headnote{grid-column:auto}
  .lede,.headnote{display:none}
  .mapzone{position:relative;height:auto;padding-bottom:8px}
  .mapwrap{position:relative;inset:auto;height:auto}
  .mapwrap svg{height:auto;aspect-ratio:1000/1063}
  .ranking,.legend,.mapctl{position:static;width:auto;margin-top:16px}
  .mapctl{justify-items:start}
  .card{overflow:visible;height:auto;padding-top:24px;border-top:8px solid var(--ink);margin-top:16px}
  .gridov{display:none!important}
}
@media (max-width:600px){
  .name{font-size:52px;line-height:50px;margin-bottom:24px}
  .name.long{font-size:40px;line-height:40px}
  .score{height:184px}
  .score-num{font-size:168px;line-height:168px;bottom:-25px;padding-left:6px}
  .score-label{left:16px;top:12px;font-size:13px}
  .score-max{top:12px;right:12px;font-size:13px}
  .facts{grid-template-columns:1fr;row-gap:20px}
  .rank,.summary{grid-column:1}
  .sec{grid-template-columns:1fr;row-gap:20px;margin-top:64px}
  .sec-head,.sec-body{grid-column:1}
  .thumbs{column-gap:8px}
  .caption{grid-template-columns:1fr;row-gap:4px}
  .caption p:first-child,.caption p:last-child{grid-column:1}
  .routes{grid-template-columns:1fr;row-gap:20px}
  .place{grid-template-columns:72px 1fr 28px}
  .portals{grid-template-columns:1fr}
  .views{width:100%}
}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span class="brand-name">Moje Miejsce</span></div>
    <p class="lede" id="lede"></p>
    <div class="profiles" role="group" aria-label="Profil" id="profiles"></div>
    <p class="headnote" id="headnote"></p>
  </header>

  <main class="card" id="card" tabindex="-1" aria-live="polite"></main>

  <section class="mapzone" id="mapzone" aria-label="Mapa osiedli Warszawy">
    <div class="ranking" id="ranking"></div>
    <div class="mapwrap" id="mapwrap"></div>
    <div class="tip" id="tip" role="status"></div>
    <div class="legend" id="legend"></div>
    <div class="mapctl">
      <div class="views" role="group" aria-label="Widok mapy" id="views">
        <button type="button" data-view="city" aria-pressed="true">Warszawa</button>
        <button type="button" data-view="plan" aria-pressed="false">Okolica</button>
      </div>
      <p class="mapcred" id="mapcred"></p>
      <button type="button" class="gridbtn" id="gridbtn" aria-pressed="false">Pokaż siatkę (G)</button>
    </div>
  </section>
</div>
<div class="gridov" id="gridov" aria-hidden="true"><div></div></div>

<script src="../shared/data.js"></script>
<script>
(function(){
'use strict';
const MM = window.MM, F = MM.featured, CITY = MM.city, NB = MM.neighborhood;
const OS = CITY.osiedla;
const byId = Object.fromEntries(OS.map(o => [o.id, o]));
const TOTAL = OS.length;
const state = { profile: MM.activeProfile || 'senior', sel: F.slug, view: 'city', photo: 0 };
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nf = new Intl.NumberFormat('pl-PL');
const fmt = n => nf.format(n);
const fmt1 = n => new Intl.NumberFormat('pl-PL',{maximumFractionDigits:1}).format(n);
const profTitle = p => MM.profiles[p].title;
const CLASS_T = [40, 50, 60, 70];
const cls = m => m >= 70 ? 4 : m >= 60 ? 3 : m >= 50 ? 2 : m >= 40 ? 1 : 0;
const prioFor = p => p === 'senior' ? MM.seniorPriorities : [];

/* ---------- header ---------- */
$('#lede').textContent = 'Okolice Warszawy dopasowane do Twojego życia, zanim zaczniesz szukać mieszkania.';
const profBox = $('#profiles');
profBox.innerHTML = ['student','rodzina','senior'].map(p =>
  `<button type="button" data-p="${p}" aria-pressed="${p===state.profile}" title="${esc(MM.profiles[p].description)}">${esc(profTitle(p))}</button>`).join('');
profBox.addEventListener('click', e => {
  const b = e.target.closest('button[data-p]'); if (!b) return;
  state.profile = b.dataset.p; renderAll(false);
});
function renderHead(){
  profBox.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.p === state.profile)));
  $('#headnote').innerHTML = `<b>${esc(profTitle(state.profile))}:</b> ${esc(MM.profiles[state.profile].description)}`;
}

/* ---------- city map ---------- */
const VBW = CITY.w, VBH = CITY.h;
function cityMarkup(){
  let s = `<svg viewBox="0 0 ${VBW} ${VBH}" preserveAspectRatio="xMinYMax meet" role="img" aria-label="Mapa 143 osiedli Warszawy, kolor według dopasowania"><g id="osd">`;
  for (const o of OS) s += `<path class="osd" data-id="${o.id}" d="${o.d}" tabindex="0" role="button" aria-label="${esc(o.name)}"></path>`;
  s += `</g><path class="river" d="${CITY.river}"></path>`;
  s += `<text class="river-l" x="610" y="560" transform="rotate(48 610 560)">Wisła</text>`;
  s += `</svg>`;
  return s;
}
function planMarkup(){
  const W = { motorway:10, motorway_link:4, secondary:9, secondary_link:4, tertiary:7, tertiary_link:3, residential:3.5, living_street:2.5, unclassified:3.5 };
  let s = `<svg class="plan" viewBox="0 0 ${NB.w} ${NB.h}" preserveAspectRatio="xMinYMax meet" role="img" aria-label="Plan okolicy Starych Bielan: budynki, zieleń, drogi i miejsca z karty">`;
  for (const g of NB.green) s += `<path class="grn" d="${g.d}"></path>`;
  for (const w of NB.water) s += `<path class="wtr" d="${w}"></path>`;
  for (const r of NB.roads) s += `<path class="rd" d="${r.d}" stroke-width="${W[r.hw]||3}"></path>`;
  for (const b of NB.buildings) s += `<path class="bld" d="${b.d}"></path>`;
  s += `<path class="outl" d="${NB.outline}"></path>`;
  placesSorted().forEach((h, i) => {
    const p = NB.places.find(q => q.id === h.id); if (!p) return;
    s += `<g class="pin" data-pid="${h.id}" transform="translate(${p.xy[0]} ${p.xy[1]})"><title>${esc(h.name)}, ${h.walkMin} min pieszo</title><rect x="-17" y="-17" width="34" height="34"></rect><text x="0" y="1">${i+1}</text></g>`;
  });
  s += `</svg>`;
  return s;
}
function placesSorted(){ return F.highlights.slice().sort((a,b) => a.walkMin - b.walkMin); }

const wrap = $('#mapwrap');
function renderMapView(){
  wrap.innerHTML = state.view === 'city' ? cityMarkup() : planMarkup();
  document.querySelectorAll('#views button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.view === state.view)));
  $('#ranking').style.display = state.view === 'city' ? '' : 'none';
  $('#mapzone').classList.toggle('is-plan', state.view !== 'city');
  renderLegend();
  if (state.view === 'city') { paintMap(); placeLabel(); }
  else { const l = document.querySelector('.maplabel'); if (l) l.remove(); }
  $('#mapcred').textContent = state.view === 'city'
    ? 'Granice osiedli: m.st. Warszawa. Dopasowanie z otwartych danych miasta.'
    : 'Plan: © współtwórcy OpenStreetMap. Czerwona linia: granica osiedla.';
}
function paintMap(){
  const p = state.profile;
  wrap.querySelectorAll('.osd').forEach(el => {
    const o = byId[el.dataset.id];
    el.setAttribute('class', `osd c${cls(o.match[p])}${o.id === state.sel ? ' sel' : ''}`);
    el.setAttribute('aria-label', `${o.name}, dopasowanie ${o.match[p]}, ${o.rank[p]}. miejsce`);
    el.setAttribute('aria-pressed', String(o.id === state.sel));
  });
  const g = wrap.querySelector('#osd'); const selEl = wrap.querySelector(`.osd[data-id="${state.sel}"]`);
  if (g && selEl) g.appendChild(selEl);
}
function svgPoint(x, y){
  const svg = wrap.querySelector('svg'); if (!svg) return null;
  const r = svg.getBoundingClientRect(), z = $('#mapzone').getBoundingClientRect();
  const sc = Math.min(r.width / VBW, r.height / VBH);
  const ox = r.left - z.left, oy = r.top - z.top + (r.height - VBH * sc);
  return [ox + x * sc, oy + y * sc];
}
function placeLabel(){
  let l = document.querySelector('.maplabel');
  if (!l) { l = document.createElement('div'); l.className = 'maplabel'; l.setAttribute('aria-hidden','true'); $('#mapzone').appendChild(l); }
  const o = byId[state.sel]; const pt = svgPoint(o.cx, o.cy); if (!pt) return;
  l.innerHTML = `<i></i><span>${esc(o.name)}<b>${o.match[state.profile]}</b></span>`;
  l.style.left = (pt[0] + 6) + 'px'; l.style.top = (pt[1] - 14) + 'px';
}

/* hover / click on map */
const tip = $('#tip');
wrap.addEventListener('mousemove', e => {
  const el = e.target.closest('.osd');
  if (!el) { tip.classList.remove('on'); return; }
  const o = byId[el.dataset.id], p = state.profile;
  tip.innerHTML = `<div class="tip-n">${esc(o.name)}</div><div class="tip-d">${esc(o.district)}</div><div class="tip-m"><b>${o.match[p]}</b><span>dopasowanie<br>${o.rank[p]}. miejsce ze ${TOTAL}</span></div>`;
  const z = $('#mapzone').getBoundingClientRect();
  let x = e.clientX - z.left + 16, y = e.clientY - z.top + 16;
  if (x + 200 > z.width) x = e.clientX - z.left - 200;
  if (y + 100 > z.height) y = e.clientY - z.top - 100;
  tip.style.left = x + 'px'; tip.style.top = y + 'px'; tip.classList.add('on');
});
wrap.addEventListener('mouseleave', () => tip.classList.remove('on'));
wrap.addEventListener('click', e => {
  const el = e.target.closest('.osd'); if (el) return select(el.dataset.id);
  const pin = e.target.closest('.pin'); if (pin) hotPlace(pin.dataset.pid, true);
});
wrap.addEventListener('keydown', e => {
  const el = e.target.closest('.osd');
  if (el && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); select(el.dataset.id); }
});
wrap.addEventListener('focusin', e => {
  const el = e.target.closest('.osd'); if (!el) return;
  const o = byId[el.dataset.id], p = state.profile, pt = svgPoint(o.cx, o.cy);
  tip.innerHTML = `<div class="tip-n">${esc(o.name)}</div><div class="tip-d">${esc(o.district)}</div><div class="tip-m"><b>${o.match[p]}</b><span>dopasowanie<br>${o.rank[p]}. miejsce ze ${TOTAL}</span></div>`;
  if (pt) { tip.style.left = (pt[0] + 16) + 'px'; tip.style.top = (pt[1] + 16) + 'px'; }
  tip.classList.add('on');
});
wrap.addEventListener('focusout', () => tip.classList.remove('on'));

document.querySelectorAll('#views button').forEach(b => b.addEventListener('click', () => { state.view = b.dataset.view; tip.classList.remove('on'); renderMapView(); }));

function select(id){
  state.sel = id; state.photo = 0;
  if (state.view !== 'city' && id !== F.slug) { state.view = 'city'; renderMapView(); }
  else paintMap();
  placeLabel(); renderRanking(); renderCard(); $('#card').scrollTop = 0;
}

/* ---------- ranking ---------- */
function renderRanking(){
  const p = state.profile;
  const top = OS.slice().sort((a,b) => a.rank[p] - b.rank[p]).slice(0, 10);
  $('#ranking').innerHTML = `<h2>Najlepsze 10</h2><p class="rk-sub">ze ${TOTAL} osiedli, profil ${esc(profTitle(p))}</p><ol>` +
    top.map(o => `<li><button type="button" data-id="${o.id}" aria-current="${o.id===state.sel}"><span class="r">${o.rank[p]}.</span><span class="nm">${esc(o.name)}</span><span class="m">${o.match[p]}</span></button></li>`).join('') + `</ol>`;
}
$('#ranking').addEventListener('click', e => { const b = e.target.closest('button[data-id]'); if (b) select(b.dataset.id); });
$('#ranking').addEventListener('mouseover', e => { const b = e.target.closest('button[data-id]'); hov(b && b.dataset.id); });
$('#ranking').addEventListener('mouseleave', () => hov(null));
function hov(id){ wrap.querySelectorAll('.osd.hov').forEach(x => x.classList.remove('hov')); if (id) { const el = wrap.querySelector(`.osd[data-id="${id}"]`); if (el) el.classList.add('hov'); } }

/* ---------- legend ---------- */
function renderLegend(){
  const L = $('#legend');
  if (state.view === 'city') {
    const rows = [['70–100','m4'],['60–69','m3'],['50–59','m2'],['40–49','m1'],['0–39','m0']];
    L.innerHTML = `<h2>Dopasowanie, profil ${esc(profTitle(state.profile))}</h2><ul>` +
      rows.map(r => `<li><i style="background:var(--${r[1]})"></i>${r[0]}</li>`).join('') +
      `<li><i style="background:var(--red)"></i>wybrane osiedle</li></ul>`;
  } else {
    L.innerHTML = `<h2>Plan okolicy</h2><ul>
      <li><i style="background:var(--ink)"></i>budynki</li>
      <li><i style="background:#DCDCDC"></i>parki i ogrody</li>
      <li><i style="background:var(--m1);height:6px"></i>ulice</li>
      <li><i style="background:var(--red);height:6px"></i>granica osiedla</li>
      <li><i style="background:var(--red);width:20px"></i>miejsca z karty</li></ul>`;
  }
}

/* ---------- card ---------- */
function headMarkup(o, full){
  const p = state.profile, m = o.match[p], r = o.rank[p];
  const long = o.name.length > 18;
  const sentence = full && p === 'senior' ? F.summary : o.blurb[p];
  return `
  <p class="meta"><span>Dzielnica <b>${esc(o.district)}</b></span><span>${fmt1(o.areaKm2)} km²</span></p>
  <h1 class="name${long ? ' long' : ''}">${esc(o.name)}</h1>
  <div class="score" role="img" aria-label="Dopasowanie ${m} na 100 dla profilu ${esc(profTitle(p))}">
    <div class="score-fill" style="width:${m}%"></div>
    <div class="score-num" aria-hidden="true">${m}</div>
    <div class="score-num on" aria-hidden="true" style="clip-path:inset(0 ${100 - m}% 0 0)">${m}</div>
    <p class="score-label${m > 40 ? ' on' : ''}">Dopasowanie, profil ${esc(profTitle(p))}</p>
    <p class="score-max">/100</p>
  </div>
  <div class="scale" aria-hidden="true"><span>0</span><span>25</span><span>50</span><span>75</span><span>100</span></div>
  <div class="facts">
    <div class="rank"><div class="rank-num">${r}.</div><p class="rank-txt"><b>miejsce ze ${TOTAL}</b> osiedli dla profilu ${esc(profTitle(p))}</p></div>
    <p class="summary">${esc(sentence)}</p>
  </div>`;
}
function catsMarkup(stats, p){
  const pr = prioFor(p);
  const keys = Object.keys(MM.categories).sort((a,b) => (pr.includes(b) - pr.includes(a)) || (stats[b] - stats[a]));
  return `<div class="cats">` + keys.map(k => {
    const v = stats[k], isP = pr.includes(k);
    return `<div class="cat${isP ? ' prio' : ''}"><div class="cat-l"><span>${esc(MM.categories[k])}</span>${isP ? '<em>priorytet</em>' : ''}</div><div class="cat-bar" role="img" aria-label="${esc(MM.categories[k])}: ${v} na 100"><i style="width:${v}%"></i></div><div class="cat-v">${v}</div></div>`;
  }).join('') + `</div>`;
}
function sec(title, desc, body, id){
  return `<section class="sec"${id ? ` id="${id}"` : ''}><div class="sec-head"><h2>${title}</h2>${desc ? `<p>${desc}</p>` : ''}</div><div class="sec-body">${body}</div></section>`;
}
const ICON_MAP = `<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M1 3h4v10H1zM6 3h4v10H6zM11 3h4v10h-4z" fill="currentColor"></path></svg>`;
const ICON_OUT = `<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M4 2h8v8h-2V5.4L3.4 12 2 10.6 8.6 4H4z" fill="currentColor"></path></svg>`;

function fullCard(){
  const p = state.profile;
  const o = byId[F.slug];
  const ph = F.heroImages[state.photo];
  const pr = prioFor(p);
  let h = headMarkup(o, true);

  // photos
  h += `<div class="photos"><div class="photo-main"><img src="${ph.src}" alt="${esc(ph.alt)}"></div>
    <div class="caption"><p>${esc(ph.alt)}</p><p>${esc(ph.credit)}</p></div>
    <div class="thumbs" role="group" aria-label="Zdjęcia okolicy">${F.heroImages.map((im,i) =>
      `<button type="button" data-ph="${i}" aria-current="${i===state.photo}" aria-label="Zdjęcie ${i+1}: ${esc(im.alt)}"><img src="${im.src}" alt="" loading="lazy"></button>`).join('')}</div></div>`;

  // categories
  h += sec('Dziesięć kategorii',
    `Wynik 0–100 na tle 143 osiedli.${pr.length ? ` <b>Czerwone słupki</b> to priorytety profilu ${esc(profTitle(p))}: ${pr.map(k => MM.categories[k].toLowerCase()).join(', ')}.` : ''}`,
    catsMarkup(F.stats, p));

  // places
  const places = placesSorted();
  h += sec('W okolicy pieszo',
    `Minuty pieszo od środka osiedla. Numery odpowiadają punktom na planie okolicy.`,
    `<div class="places">${places.map((x,i) => `<button type="button" class="place" data-pid="${x.id}"><div class="place-min">${x.walkMin}<span>min</span></div><div><div class="place-t">${esc(x.name)}</div><div class="place-d">${esc(x.description)} ${fmt(x.distanceM)} m${x.distanceTo ? ' do skraju' : ''}.</div></div><span class="place-n" aria-hidden="true">${i+1}</span></button>`).join('')}</div>
     <p style="margin-top:24px"><button type="button" class="btn" id="toPlan">${ICON_MAP}Pokaż plan okolicy</button></p>`);

  // commute
  const maxMin = 60;
  const modeName = { metro:'metro', tramwaj:'tramwaj', autobus:'autobus' };
  h += sec('Dojazd rano',
    `Przyjazd 7:30–9:00 w dzień roboczy. Komunikacja: rozkład ZTM, mediana z ${F.commute[0].cells} komórek 250 m. Rower: trasa OSRM. Słupki w skali do 60 min.`,
    `<div class="commute">${F.commute.map(c => `
      <div><p class="cm-t">${esc(c.label)}</p>
        <div class="cm-row"><span>komunikacja</span><div class="cm-bar"><i style="width:${c.minutes.komunikacja/maxMin*100}%"></i></div><div class="cm-v">${c.minutes.komunikacja}<small>min</small></div></div>
        <div class="cm-row bike"><span>rower</span><div class="cm-bar"><i style="width:${c.minutes.rower/maxMin*100}%"></i></div><div class="cm-v">${c.minutes.rower}<small>min</small></div></div>
        <p class="cm-modes">Tylko jednym środkiem: ${Object.entries(c.transitByMode).map(([k,v]) => `${modeName[k]||k} ${Math.round(v)} min`).join(', ')}</p>
      </div>`).join('')}
    </div>
    <div class="routes"><h3>Na co dzień: najbliższe cele</h3><div class="rt-head" aria-hidden="true"><span></span><span></span><span>pieszo</span><span>rower</span></div>${groupRoutes().map(g => g.items.map((r,i) => `<div class="rt"><span class="rt-g">${i === 0 ? esc(g.label) : ''}</span><span>${esc(r.destinationName)}</span><b>${r.minutes.pieszo}<small>min</small></b><b class="bk">${r.minutes.rower}<small>min</small></b></div>`).join('')).join('')}</div>`);

  // prices
  const P = F.prices, R = P.rcn, lo = 12000, hi = 20000, X = v => ((v - lo) / (hi - lo) * 100).toFixed(2);
  const diff = (P.buyPerM2 / P.cityBuyPerM2 - 1) * 100;
  h += sec('Ceny mieszkań',
    `${esc(P.basisLabel)}. Słupek: środkowa połowa transakcji (25–75%), kreska: mediana.`,
    `<div class="price-big"><strong>${fmt(P.buyPerM2)}</strong><span>zł/m², mediana na osiedlu</span></div>
     <div class="price-cmp"><div class="up"><b>+${fmt1(diff)}%</b>wobec mediany Warszawy</div><div><b>${fmt(P.cityBuyPerM2)}</b>zł/m², mediana Warszawy</div></div>
     <div class="range" role="img" aria-label="Stare Bielany: 25–75% od ${fmt(R.msi.p25)} do ${fmt(R.msi.p75)} zł/m². Warszawa: od ${fmt(R.city.p25)} do ${fmt(R.city.p75)} zł/m².">
       <div class="rg-row own"><span>Stare Bielany<small>${fmt(R.msi.n)} transakcji</small></span><div class="rg-track"><div class="rg-iqr" style="left:${X(R.msi.p25)}%;width:${X(R.msi.p75)-X(R.msi.p25)}%"></div><div class="rg-med" style="left:${X(R.msi.med)}%"></div></div></div>
       <div class="rg-row"><span>Warszawa<small>${fmt(R.city.n)} transakcji</small></span><div class="rg-track"><div class="rg-iqr" style="left:${X(R.city.p25)}%;width:${X(R.city.p75)-X(R.city.p25)}%"></div><div class="rg-med" style="left:${X(R.city.med)}%"></div></div></div>
       <div class="rg-axis" aria-hidden="true"><span></span><div>${[12,14,16,18,20].map(t => `<span style="left:${X(t*1000)}%">${t} tys.</span>`).join('')}</div></div>
     </div>
     <p class="note">${esc(P.rentNote)}</p>`);

  // traffic
  const T = F.traffic, tmax = Math.max(...T), YMAX = 40;
  const peakH = T.map((v,i) => v === tmax ? i : -1).filter(i => i >= 0);
  h += sec('Ruch w ciągu doby',
    `${esc(F.trafficRoad)}. Indeks 0–100; poniżej 35 ruch jest płynny.`,
    `<div class="traffic" role="img" aria-label="Indeks spowolnienia w ciągu doby, najwyżej ${tmax} o godzinach ${peakH.join(' i ')}.">
       <div class="tr-y" aria-hidden="true"><span style="top:0">${YMAX}</span><span style="top:50%">${YMAX/2}</span><span style="top:100%">0</span></div>
       <div class="tr-plot">${T.map((v,i) => `<i class="${v === tmax ? 'peak' : ''}" style="height:${v/YMAX*100}%" title="${i}:00, ${v}"></i>`).join('')}
         <div class="tr-th" style="bottom:${35/YMAX*100}%"><span>35: umiarkowane spowolnienie</span></div></div>
       <div class="tr-x" aria-hidden="true"><span>0:00</span><span>6:00</span><span>12:00</span><span><span>18:00</span><span>24:00</span></span></div>
     </div>
     <p class="note">Najwyżej <b style="color:var(--ink)">${tmax}</b> o ${peakH.map(i => `${i}:00`).join(' i ')}. Przez całą dobę ruch płynny.</p>`);

  // timeline
  const tl = F.timeline.slice().sort((a,b) => (a.year - b.year) || ((a.yearUncertain?1:0) - (b.yearUncertain?1:0)));
  h += sec('Plany zmian w okolicy',
    `Inwestycje i projekty 2026–2040 ze źródeł miejskich i prasy lokalnej, odczyt: październik 2026.`,
    `<div class="tl">${tl.map(t => {
      const noDate = t.yearPlacement === 'bez terminu';
      const yr = noDate ? '—' : t.year;
      const sub = noDate ? 'bez terminu' : (t.yearUncertain ? 'termin niepewny' : (t.status === 'w budowie' ? 'koniec prac' : 'plan'));
      return `<article class="tl-item"><div class="tl-year${noDate || t.yearUncertain ? ' soft' : ''}">${yr}<small>${sub}</small></div>
        <div><span class="tag${t.status === 'w budowie' ? ' live' : ''}">${esc(t.status)}</span><h3 class="tl-t">${esc(t.title)}</h3><p class="tl-d">${esc(t.description)}</p><p class="tl-n">${esc(t.yearNote)}</p></div></article>`;
    }).join('')}</div>`);

  // portals
  h += sec('Szukaj mieszkań', `Ogłoszenia z tego osiedla w serwisach zewnętrznych.`,
    `<div class="portals">${F.portals.map(pt => `<a class="btn" href="${esc(pt.buyUrl)}" target="_blank" rel="noopener">${esc(pt.name)}: kupno ${ICON_OUT}</a><a class="btn ghost" href="${esc(pt.rentUrl)}" target="_blank" rel="noopener">${esc(pt.name)}: wynajem ${ICON_OUT}</a>`).join('')}</div>`);

  // data note
  h += sec('O danych', '',
    `<div class="credits"><p><b>${esc(MM.credits)}.</b></p><p>${esc(F.prices.sourceNote)}</p><p>${esc(F.commute[0].source)}</p><p>Zdjęcia: ${F.heroImages.map(i => esc(i.credit)).join('; ')}.</p></div>`);
  return h;
}
function groupRoutes(){
  const g = [];
  for (const r of F.routes) { let x = g.find(y => y.label === r.label); if (!x) g.push(x = { label: r.label, items: [] }); x.items.push(r); }
  g.forEach(x => x.items.sort((a,b) => a.minutes.pieszo - b.minutes.pieszo));
  return g;
}
function compactCard(){
  const o = byId[state.sel], p = state.profile;
  let h = headMarkup(o, false);
  h += sec('Dziesięć kategorii', `Wynik 0–100 na tle 143 osiedli.${prioFor(p).length ? ` <b>Czerwone słupki</b> to priorytety profilu ${esc(profTitle(p))}.` : ''}`, catsMarkup(o.cats, p));
  h += `<div class="back"><button type="button" class="btn" data-go="${F.slug}">Wróć do pełnej karty: Stare Bielany</button>
    <p class="compact-note">Pełna karta ze zdjęciami, cenami, dojazdami i planami zmian jest w prototypie przygotowana dla Starych Bielan.</p></div>`;
  return h;
}
function renderCard(){
  const c = $('#card');
  c.innerHTML = `<div class="card-inner">${state.sel === F.slug ? fullCard() : compactCard()}</div>`;
}
$('#card').addEventListener('click', e => {
  const t = e.target.closest('[data-ph]'); if (t) { state.photo = +t.dataset.ph; const sc = $('#card').scrollTop; renderCard(); $('#card').scrollTop = sc; return; }
  const g = e.target.closest('[data-go]'); if (g) return select(g.dataset.go);
  if (e.target.closest('#toPlan')) { state.view = 'plan'; renderMapView(); return; }
  const pl = e.target.closest('.place'); if (pl) { if (state.view !== 'plan') { state.view = 'plan'; renderMapView(); } hotPlace(pl.dataset.pid); }
});
$('#card').addEventListener('mouseover', e => { const pl = e.target.closest('.place'); if (pl && state.view === 'plan') hotPlace(pl.dataset.pid); });
function hotPlace(id, scroll){
  document.querySelectorAll('.pin.hot, .place.hot').forEach(x => x.classList.remove('hot'));
  const pin = wrap.querySelector(`.pin[data-pid="${id}"]`); if (pin) { pin.classList.add('hot'); pin.parentNode.appendChild(pin); }
  const row = document.querySelector(`.place[data-pid="${id}"]`); if (row) { row.classList.add('hot'); if (scroll) row.scrollIntoView({ block:'center', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' }); }
}

/* ---------- grid overlay ---------- */
$('#gridov div').innerHTML = '<span></span>'.repeat(12);
function toggleGrid(){ const on = $('#gridov').classList.toggle('on'); $('#gridbtn').setAttribute('aria-pressed', String(on)); }
$('#gridbtn').addEventListener('click', toggleGrid);
document.addEventListener('keydown', e => { if ((e.key === 'g' || e.key === 'G') && !e.metaKey && !e.ctrlKey && !/input|textarea/i.test(e.target.tagName)) toggleGrid(); });

function renderAll(first){
  renderHead();
  if (first) renderMapView(); else { if (state.view === 'city') { paintMap(); placeLabel(); } renderLegend(); }
  renderRanking();
  const sc = $('#card').scrollTop; renderCard(); if (!first) $('#card').scrollTop = sc;
}
renderAll(true);
window.addEventListener('resize', () => { if (state.view === 'city') placeLabel(); });
if (document.fonts) document.fonts.ready.then(() => { if (state.view === 'city') placeLabel(); });
if (/[?&]grid=1/.test(location.search)) toggleGrid();
const qv = location.search.match(/[?&]view=(\w+)/); if (qv) { state.view = qv[1]; renderMapView(); }
const qs = location.search.match(/[?&]sel=([\w-]+)/); if (qs && byId[qs[1]]) select(qs[1]);
const qp = location.search.match(/[?&]p=(\w+)/); if (qp && MM.profiles[qp[1]]) { state.profile = qp[1]; renderAll(false); }
const qh = location.search.match(/[?&]hover=([\w-]+)/); if (qh) { const el = wrap.querySelector(`.osd[data-id="${qh[1]}"]`); if (el) { el.classList.add('hov'); el.dispatchEvent(new FocusEvent('focusin', {bubbles:true})); } }
const qy = location.search.match(/[?&]y=(\d+)/); if (qy) $('#card').scrollTop = +qy[1];
})();
</script>
</body>
</html>
