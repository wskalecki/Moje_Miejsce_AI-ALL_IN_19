[project]
name = "siatka-etl"
version = "0.1.0"
description = "ETL framework for Siatka: Warsaw open data -> 1 km grid metrics, persona scores and POI layers"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "pyproj>=3.6",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "shapely>=2.0",
]

[project.scripts]
siatka = "siatka.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/siatka"]

[tool.pytest.ini_options]
testpaths = ["tests"]
