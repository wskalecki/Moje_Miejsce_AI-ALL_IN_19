name: Hackathon task
description: Feature, data, or design task for Siatka MVP
title: "[area]: "
labels: []
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - data
        - frontend
        - design
        - 3d
        - chore
    validations:
      required: true
  - type: input
    id: owner
    attributes:
      label: Suggested owner (P1–P5)
      placeholder: P1 Data platform
  - type: textarea
    id: goal
    attributes:
      label: Goal
      placeholder: What should be true when this is done?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: "- [ ] ..."
    validations:
      required: true
  - type: textarea
    id: files
    attributes:
      label: Files / paths
      placeholder: data/poi/transit.geojson
  - type: textarea
    id: depends
    attributes:
      label: Depends on
      placeholder: "#issue or none"
