<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Siatka — nagrywanie przelotu (dev)</title>
    <style>
      html,
      body,
      #map {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
      /* atmospheric perspective: warm haze towards the horizon + a low sun off-frame */
      #haze {
        position: fixed;
        inset: 0;
        pointer-events: none;
        background:
          radial-gradient(60% 50% at 92% -10%, rgba(255, 222, 178, 0.55), rgba(255, 222, 178, 0) 70%),
          linear-gradient(to bottom, rgba(246, 214, 190, 0.62) 0%, rgba(240, 206, 186, 0.26) 16%, rgba(240, 206, 186, 0) 36%);
      }
      #credit {
        position: fixed;
        right: 14px;
        bottom: 10px;
        font: 500 10px/1 system-ui, sans-serif;
        letter-spacing: 0.02em;
        color: rgba(255, 255, 255, 0.55);
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
      }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <div id="haze"></div>
    <div id="credit">© OpenStreetMap · OpenMapTiles · OpenFreeMap</div>
    <script type="module" src="/src/cinematic/__record/main.ts"></script>
  </body>
</html>
